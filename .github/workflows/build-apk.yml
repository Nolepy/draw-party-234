name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Salinan game ikut dibundel di APK sebagai cadangan saat HP offline
      - name: Bundle game untuk mode offline
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/index.html android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Publikasikan APK ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DrawParty234.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DrawParty234.apk \
            --title "Draw Party 234 MiniGames (APK terbaru)" \
            --notes "Unduh DrawParty234.apk lalu pasang di HP Android. Update game otomatis tanpa pasang ulang."
