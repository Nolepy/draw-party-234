<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw Party 234 MiniGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root{--ink:#262322;--paper:#f4f2ec}
  html,body{margin:0;height:100%;overflow:hidden;background:#dedbd2;font-family:'Mochiy Pop One',system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;background:rgba(38,35,34,.18)}
  .hidden{display:none!important}
  .card{background-color:var(--paper);border:3px solid var(--ink);border-radius:20px 26px 18px 24px;box-shadow:6px 6px 0 var(--ink);padding:12px 18px;width:100%;max-width:640px;max-height:100%;overflow:auto;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:7px;transform:rotate(-.6deg)}
  h1{margin:0;font-size:26px;line-height:1.15;font-weight:400;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);letter-spacing:.5px}
  h1 .a{color:#e8735a}h1 .b{color:#f2c94c}h1 .c{color:#6aa6d8}
  h3{margin:2px 0 0;font-size:12px;font-weight:400;opacity:.65}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{font-family:inherit;font-size:14px;padding:7px 12px;border-radius:12px 14px 11px 13px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .08s}
  .chip small{display:block;font-size:10px;opacity:.65;margin-top:1px}
  .chip.sel{background:#f2c94c;transform:translate(-1px,-2px) rotate(-1.5deg);box-shadow:4px 5px 0 var(--ink)}
  .chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .go{font-family:inherit;font-size:20px;padding:9px 40px;border:3px solid var(--ink);border-radius:16px 12px 18px 14px;background:#7cc47a;color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;align-self:center}
  .go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .go.alt{background:#6aa6d8}
  .hint{font-size:10.5px;opacity:.7;line-height:1.45}
  .ver{position:absolute;right:14px;bottom:6px;font-size:10px;opacity:.45}
  #quit{position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:5;font-family:inherit;background:var(--paper);border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:1px 12px;font-size:12px;opacity:.75;box-shadow:2px 2px 0 var(--ink)}
  #rot{display:none;position:fixed;inset:0;z-index:10;background:var(--paper);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
  @media (orientation:portrait){#rot{display:flex}}
  #champ{font-size:26px}
  /* ===== Halaman utama ===== */
  #home{position:fixed;inset:0;overflow:hidden}
  #home button{font-family:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .side{position:absolute;left:2.5vw;top:4vh;display:flex;flex-direction:column;gap:2.5vh}
  .sbtn{position:relative;width:16vh;height:16vh;padding:0;border:0;background:none}
  .sbtn svg,.ico svg,.badge svg,.mbtn .ic svg,.bots svg{width:100%;height:100%;display:block;overflow:visible}
  .sbtn:active,.ico:active,.badge:active,.bots button:active{transform:scale(.92)}
  .dot{position:absolute;right:.5vh;top:.5vh;width:3.2vh;height:3.2vh;border-radius:50%;background:#e8735a;border:2px solid var(--ink)}
  .logo{position:absolute;left:calc(16vh + 5vw);top:3vh;transform:rotate(-2deg);pointer-events:none}
  .logo h1{font-size:5.6vh;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
  .panel{position:absolute;top:-3vh;bottom:-3vh;right:-8vw;width:54vw;transform:skewX(-7deg);transform-origin:bottom left;
    background-color:#efe9f6;background-image:repeating-linear-gradient(45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px),repeating-linear-gradient(-45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px);
    border-left:5px solid var(--ink);box-shadow:-9px 0 0 #f2c94c,-14px 0 0 var(--ink)}
  .inner{transform:skewX(7deg);height:100%;display:flex;flex-direction:column;justify-content:center;gap:2.3vh;padding:5vh 11vw 5vh 6vw;box-sizing:border-box}
  .tops{display:flex;align-items:center;justify-content:center;gap:3.5vw}
  .badge{position:relative;width:19vh;height:19vh;padding:0;border:0;background:none}
  .badge b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:1.5vh;font-weight:400;font-size:6.2vh;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
  .ico{display:flex;flex-direction:column;align-items:center;gap:.5vh;padding:0;border:0;background:none;font-size:3.2vh}
  .ico svg{width:10vh;height:10vh}
  .mbtn{position:relative;display:flex;align-items:center;height:12.5vh;padding:0 0 0 14vh;border:3px solid var(--ink);border-radius:6px;background:#fff;transform:skewX(-10deg);box-shadow:5px 5px 0 var(--ink);font-size:5vh;letter-spacing:.5px;transition:transform .08s}
  .mbtn:nth-of-type(1){margin-left:0}.mbtn:nth-of-type(2){margin-left:2vh}.mbtn:nth-of-type(3){margin-left:4vh}.mbtn:nth-of-type(4){margin-left:6vh}
  .mbtn span{transform:skewX(10deg);flex:1;text-align:center}
  .mbtn .ic{position:absolute;left:-5vh;top:50%;width:16vh;height:16vh;transform:translateY(-50%) skewX(10deg)}
  .mbtn:active{transform:skewX(-10deg) translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .mbtn.gold{background:#f2c94c}
  .bots{display:flex;justify-content:flex-end;gap:3vw}
  .bots button{width:10vh;height:10vh;padding:0;border:0;background:none}
  /* modal */
  #modal .card{max-width:560px;position:relative}
  #modal h2{margin:0;font-size:22px;font-weight:400}
  .x{position:absolute;right:8px;top:6px;font-family:inherit;border:2px solid var(--ink);background:#fff;border-radius:10px;width:34px;height:34px;font-size:16px;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
  .big{font-size:22px;padding:14px 22px}
  .list{display:flex;flex-direction:column;gap:6px;font-size:15px;text-align:left}
  .list div{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px}
  .ball{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid4 > div{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 4px;font-size:13px;box-shadow:3px 3px 0 var(--ink)}
  .grid4 .ball{width:44px;height:44px;margin:0 auto 4px}
  .wheelbox{position:relative;width:min(46vh,240px);height:min(46vh,240px);margin:6px auto}
  .wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);box-sizing:border-box;position:relative;transition:transform 3.4s cubic-bezier(.15,.8,.2,1)}
  .wheel span{position:absolute;font-size:15px;color:var(--ink);white-space:nowrap}
  .pin{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);z-index:2}
  .card.blue{background:#cfe6f7;max-width:640px;transform:rotate(-1deg);padding-top:18px;overflow:visible}
  .card.blue .x{background:#e8735a;color:#fff;border-radius:6px;width:40px;height:40px;font-size:20px;top:-14px;right:-12px;transform:rotate(4deg)}
  .crown{position:absolute;left:50%;top:-34px;width:62px;height:52px;transform:translateX(-50%) rotate(-4deg)}
  .crown svg{width:100%;height:100%;overflow:visible}
  .otitle{font-size:24px!important;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
  .ocols{display:flex;gap:16px;flex-wrap:wrap}
  .ocol{flex:1 1 230px;display:flex;flex-direction:column;gap:10px;justify-content:center}
  .vrow{display:flex;align-items:center;gap:10px}
  .vrow i{width:34px;height:34px;flex:none}
  .vrow i svg{width:100%;height:100%}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:20px;margin:0;border:2.5px solid var(--ink);border-radius:12px;background:linear-gradient(90deg,#7cc47a var(--v,50%),#fff var(--v,50%));box-shadow:2px 3px 0 var(--ink);outline:none;touch-action:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
  .langsel{display:flex;align-items:center;gap:8px}
  .arw{font-family:inherit;border:0;background:none;font-size:24px;color:#3c76a8;text-shadow:2px 2px 0 var(--ink);padding:0 4px}
  .lbox{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#4b5f8c;color:#fff;border:2.5px solid var(--ink);padding:8px;transform:skewX(-6deg);box-shadow:3px 3px 0 var(--ink);font-size:15px}
  .lbox span{font-size:22px}
  .olabel{font-size:12px;opacity:.7}
  .hands{display:flex;gap:10px}
  .hand{position:relative;flex:1;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:4px 4px 6px;font-size:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .hand.on{background:#fff7d6;box-shadow:3px 3px 0 var(--ink),0 0 0 3px #7cc47a inset}
  .hand svg{width:100%;height:auto;display:block}
  .hand b{font-weight:400;color:#3c76a8}
  .hand em{position:absolute;left:6px;top:-12px;font-style:normal;font-size:24px;color:#4a8f48;text-shadow:1px 1px 0 var(--ink)}
  .orow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  .orow > span{font-size:13px;min-width:58px;text-align:left}
  .orow .chip{padding:5px 8px;font-size:12.5px;white-space:nowrap}
  .go.small{font-size:14px;padding:6px 18px;background:#7cc47a}
  #toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:20;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 16px;box-shadow:3px 3px 0 var(--ink);font-size:15px;transition:opacity .3s;pointer-events:none}
  #tab{font-size:15px;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="quit" class="hidden" data-t="menu">✕ Menu</button>

<svg width="0" height="0" style="position:absolute"><filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>

<div id="home">
  <div class="side">
    <button class="sbtn" id="giftBtn" data-icon="gift"></button>
    <button class="sbtn" id="spinBtn" data-icon="wheel"></button>
  </div>
  <div class="logo"><h1><span class="a">Draw Party</span> <span class="b">234</span> <span class="c">MiniGames</span></h1></div>
  <div class="panel"><div class="inner">
    <div class="tops">
      <button class="badge" id="bStars"><span data-icon="starbadge"></span><b id="starN">0</b></button>
      <button class="ico" id="bTro"><span data-icon="trophy"></span><em data-t="trophies" style="font-style:normal">Trofi</em></button>
      <button class="ico" id="bRank"><span data-icon="podium"></span><em data-t="ranks" style="font-style:normal">Peringkat</em></button>
    </div>
    <button class="mbtn" data-act="quick"><i class="ic" data-icon="bolt"></i><span data-t="quick">MAIN CEPAT</span></button>
    <button class="mbtn" data-act="pick"><i class="ic" data-icon="dice"></i><span data-t="pick">PILIH GAME</span></button>
    <button class="mbtn" data-act="tour"><i class="ic" data-icon="cup"></i><span data-t="tour">TURNAMEN</span></button>
    <button class="mbtn gold" data-act="chars"><i class="ic" data-icon="blobs"></i><span data-t="chars">KARAKTER</span></button>
    <div class="bots">
      <button id="bSet" data-icon="gear"></button>
      <button id="bHelp" data-icon="help"></button>
    </div>
  </div></div>
</div>

<div class="overlay hidden" id="modal"><div class="card"><button class="x" id="mx">✕</button><div id="mbody"></div></div></div>
<div id="toast" style="opacity:0"></div>

<div class="overlay hidden" id="end">
  <div class="card" style="max-width:420px">
    <div id="champ"></div>
    <div id="tab"></div>
    <div class="row">
      <button class="go" id="again" data-t="again">MAIN LAGI</button>
      <button class="go alt" id="tomenu" data-t="home">MENU</button>
    </div>
  </div>
</div>

<div id="rot" data-t="rot">Putar HP ke mode landscape 📱↔️</div>

<script>
const VERSION = 'v0.5 · musik + pengaturan';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const INK = '#262322', FONT = "'Mochiy Pop One',system-ui,sans-serif";
const font = px => `${px}px ${FONT}`;
const WW = 1200, WH = 675, CX = 600, CY = 337.5;
let W, H, DPR, S, OX, OY;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = W*DPR; cv.height = H*DPR;
  S = Math.min(W/(WW+140), H/(WH+40)); OX = (W-WW*S)/2; OY = (H-WH*S)/2;
}
addEventListener('resize', () => { resize(); buildBg(); }); resize();

const rnd = (a,b) => a + Math.random()*(b-a);
const CHARS = [
  {n:'Merah',  c:'#e8735a', d:'#b54a33', acc:'ears'},
  {n:'Biru',   c:'#6aa6d8', d:'#3c76a8', acc:'ahoge'},
  {n:'Hijau',  c:'#7cc47a', d:'#4a8f48', acc:'leaf'},
  {n:'Kuning', c:'#f2c94c', d:'#b88a12', acc:'bow'}
];
const MODES = {
  eat: {name:'Sel Rebutan', time:75, hint:'Makan permen & blob yang lebih kecil!'},
  sumo:{name:'Sumo Blob', time:0, hint:'Dorong lawan keluar ring!'},
  food:{name:'Rebutan Makanan', time:60, hint:'Onigiri = 1 poin, bintang = 3 poin!'}
};

// ---------- Kertas buku tulis (digambar sekali) ----------
function doodle(p, x, y, s, k){
  p.beginPath();
  if(k === 0){ for(let i=0;i<=10;i++){ const a = -Math.PI/2 + i*Math.PI/5, r = i%2 ? s*.45 : s; p.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); } }
  else if(k === 1){ p.moveTo(x, y+s*.7); p.bezierCurveTo(x-s*1.4, y-s*.2, x-s*.5, y-s*1.1, x, y-s*.3); p.bezierCurveTo(x+s*.5, y-s*1.1, x+s*1.4, y-s*.2, x, y+s*.7); }
  else { for(let i=0;i<40;i++){ const a = i*.45, r = i*s/40; p.lineTo(x+Math.cos(a)*r, y+Math.sin(a)*r); } }
  p.stroke();
}
function grain(g, w, h, n){
  for(let i=0;i<n;i++){ g.fillStyle = `rgba(40,36,34,${Math.random()*.07})`; g.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*1.5, 1+Math.random()*1.5); }
}
function tuft(g, x, y, s){
  g.beginPath(); g.moveTo(x-s*.5, y); g.lineTo(x-s*.65, y-s); g.moveTo(x+s*.15, y); g.lineTo(x+s*.05, y-s*1.1); g.stroke();
}
function pine(g, x, y, s, fill){
  g.lineWidth = Math.max(1.3, s*.14); g.strokeStyle = INK; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y+s*.35); g.stroke();
  for(const [dy,w] of [[0,.75],[-.55,.55]]){
    g.beginPath(); g.moveTo(x, y + s*(dy-1.1)); g.lineTo(x + s*w, y + s*dy); g.lineTo(x - s*w, y + s*dy); g.closePath();
    g.fillStyle = fill; g.fill(); g.stroke();
  }
}
function mountain(g, x, y, w, h){
  g.beginPath(); g.moveTo(x - w/2, y); g.lineTo(x - w*.12, y - h*.85); g.lineTo(x, y - h); g.lineTo(x + w*.1, y - h*.9); g.lineTo(x + w/2, y); g.closePath();
  g.fillStyle = '#efede7'; g.fill();
  g.save(); g.clip(); g.strokeStyle = 'rgba(38,35,34,.55)'; g.lineWidth = 1.4; g.beginPath();
  for(let k = 0; k < w*.6; k += 5){ g.moveTo(x + k*.15, y - h + k*.3); g.lineTo(x + w*.5, y - h*.2 + k*.35); }
  g.stroke(); g.restore();
  g.beginPath(); g.moveTo(x - w/2, y); g.lineTo(x - w*.12, y - h*.85); g.lineTo(x, y - h); g.lineTo(x + w*.1, y - h*.9); g.lineTo(x + w/2, y);
  g.lineWidth = 2.2; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.moveTo(x - w*.12, y - h*.85); g.lineTo(x, y - h); g.lineTo(x + w*.1, y - h*.9); g.lineTo(x, y - h*.72); g.closePath(); g.fill();
}
function sheep(g, x, y, s){
  g.lineWidth = 1.4; g.strokeStyle = INK;
  g.beginPath(); for(let i=0;i<6;i++){ const a = i/6*6.28; g.moveTo(x + Math.cos(a)*s*.55 + s*.3, y + Math.sin(a)*s*.35); g.arc(x + Math.cos(a)*s*.55, y + Math.sin(a)*s*.35, s*.3, 0, 7); }
  g.fillStyle = '#fff'; g.fill(); g.stroke();
  g.beginPath(); g.arc(x + s*.75, y - s*.1, s*.22, 0, 7); g.fillStyle = INK; g.fill();
}
// lantai arena (koordinat dunia, digambar sekali)
const paper = document.createElement('canvas'); paper.width = WW; paper.height = WH;
(function(){
  const p = paper.getContext('2d');
  p.fillStyle = '#f4f2ec'; p.fillRect(0,0,WW,WH);
  grain(p, WW, WH, 3000);
  p.strokeStyle = 'rgba(38,35,34,.07)'; p.lineWidth = 1.5; p.beginPath();
  for(let c = -WH*2; c < WW + WH*2; c += 80){ p.moveTo(c, 0); p.lineTo(c + WH*1.73, WH); p.moveTo(c, 0); p.lineTo(c - WH*1.73, WH); }
  p.stroke();
  p.strokeStyle = 'rgba(38,35,34,.38)'; p.lineWidth = 2; p.lineCap = 'round';
  for(let i=0;i<110;i++) tuft(p, rnd(20,WW-20), rnd(20,WH-20), rnd(6,10));
})();
// latar layar di luar arena: hutan, gunung, domba
const bg = document.createElement('canvas');
function buildBg(){
  bg.width = W*DPR; bg.height = H*DPR;
  const g = bg.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle = '#dedbd2'; g.fillRect(0,0,W,H);
  grain(g, W, H, W*H/120);
  const x0 = OX - 6, y0 = OY - 6, x1 = OX + WW*S + 6, y1 = OY + WH*S + 6;
  const outside = (x, y, m) => x < x0 - m || x > x1 + m || y < y0 - m || y > y1 + m;
  const side = Math.min(x0, W - x1);
  if(side > 40) for(let i=0;i<4;i++){
    const left = i % 2 === 0, mx = left ? rnd(5, x0 - 20) : rnd(x1 + 20, W - 5), my = rnd(H*.2, H);
    mountain(g, mx, my, rnd(60,110), rnd(45,80));
  }
  const items = [];
  for(let i=0;i<700;i++){ const x = rnd(-15, W+15), y = rnd(-5, H+25); if(outside(x, y - 6, 10)) items.push({x, y, k:Math.random()}); }
  items.sort((a,b) => a.y - b.y);
  g.strokeStyle = 'rgba(38,35,34,.4)'; g.lineWidth = 1.6; g.lineCap = 'round';
  for(const it of items){
    if(it.k < .55) pine(g, it.x, it.y, rnd(9,14), it.k < .12 ? '#bcd99a' : it.k < .2 ? '#d7e8c2' : '#f7f5ef');
    else if(it.k < .58) sheep(g, it.x, it.y, 7);
    else if(it.k < .75){ g.strokeStyle = 'rgba(38,35,34,.4)'; g.lineWidth = 1.6; tuft(g, it.x, it.y, 6); }
  }
}
// ---------- State ----------
let sel = {mode:'combo', n:2};
buildBg();
let match = null, players = [], food = [], parts = [], mode = 'eat', state = 'menu';
let tickPrev = 4, tCount = 0, tLeft = 0, tEnd = 0, endText = '', endCol = INK, arenaR = 300, elapsed = 0, T = 0, shake = 0;

// ---------- Data tersimpan (di HP ini saja) ----------

  const cols = ['#e8735a','#f2c94c','#6aa6d8','#7cc47a','#c58fd6','#f2c94c','#e8735a','#7cc47a']; let d = '';

  return `<circle cx="50" cy="50" r="44" fill="#fff"/>${d}<circle cx="50" cy="50" r="40" fill="none"/><circle cx="50" cy="50" r="8" fill="#f2c94c"/><path d="M42 4h16l-8 12z" fill="#e8735a"/>`;

// ---------- Suara: musik & efek (disintesis, tanpa file) ----------
const AC = window.AudioContext || window.webkitAudioContext;
let ac = null, musG, sfxG, noiseBuf;
function audioInit(){
  if(ac){ if(ac.state === 'suspended' && !document.hidden) ac.resume(); return; }
  if(!AC) return;
  try{
    ac = new AC();
    musG = ac.createGain(); sfxG = ac.createGain(); musG.connect(ac.destination); sfxG.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    applyVol();
  }catch(e){ ac = null; }
}
addEventListener('pointerdown', audioInit, true);
addEventListener('keydown', audioInit, true);
document.addEventListener('visibilitychange', () => { if(!ac) return; document.hidden ? ac.suspend() : ac.resume(); });
function applyVol(){ if(!ac) return; musG.gain.value = save.music*save.music*.55; sfxG.gain.value = save.sfx*.9; }
const mf = m => 440*Math.pow(2, (m-69)/12);
function tone(f, t0, dur, type, vol, dest, slide){
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + .03);
}
function noise(t0, dur, vol, dest, hp){
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t0, Math.random()*.5); src.stop(t0 + dur);
}
const SONGS = {
  // akor: [nada dasar, minor?]  melodi: 32 langkah (1/8), -1 = diam
  menu: {bpm:104, lead:'triangle', drums:1, chords:[[48,0],[43,0],[45,1],[41,0]],
    mel:[72,-1,76,-1,79,-1,76,74, 74,-1,71,-1,74,76,74,-1, 72,-1,69,-1,72,-1,76,-1, 77,-1,76,74,72,-1,-1,-1]},
  game: {bpm:140, lead:'square', drums:2, chords:[[48,0],[43,0],[45,1],[41,0]],
    mel:[72,-1,72,74,76,-1,79,-1, 79,77,76,74,71,-1,74,-1, 76,-1,76,77,79,-1,81,79, 77,76,74,72,74,-1,79,-1]}
};
let song = 'menu', mStep = 0, mNext = 0, mLoop = 0;
function setSong(n){ if(song !== n){ song = n; mStep = 0; mNext = 0; mLoop = 0; } }
function playStep(S, step, t0, st){
  const i = step % 8, [root, minor] = S.chords[Math.floor(step/8)];
  if(S.drums === 2){
    tone(mf(root - 12 + (i % 2 ? 12 : 0)), t0, st*.9, 'triangle', .3, musG);
    if(i % 4 === 0) tone(140, t0, .14, 'sine', .55, musG, 45);
    if(i % 4 === 2) noise(t0, .1, .22, musG, 1800);
    noise(t0, .03, i % 2 ? .07 : .04, musG, 8000);
  } else {
    if(i % 2 === 0) tone(mf(root - 12), t0, st*1.8, 'triangle', .28, musG);
    if(i === 0) [0, minor ? 3 : 4, 7].forEach(k => tone(mf(root + 12 + k), t0, st*7.5, 'sine', .045, musG));
    if(i % 2) noise(t0, .025, .035, musG, 9000);
  }
  const m = S.mel[step];
  if(m > 0) tone(mf(m + (mLoop % 2 && S.drums === 2 ? 12 : 0)), t0, st*.85, S.lead, S.lead === 'square' ? .055 : .11, musG);
}
function musicTick(){
  if(!ac || ac.state !== 'running' || save.music <= 0) return;
  const S = SONGS[song], st = 60/S.bpm/2;
  if(mNext < ac.currentTime) mNext = ac.currentTime + .05;
  while(mNext < ac.currentTime + .2){ playStep(S, mStep, mNext, st); mStep = (mStep + 1) % 32; if(!mStep) mLoop++; mNext += st; }
}
function sfx(n){
  if(!ac || ac.state !== 'running' || save.sfx <= 0) return;
  const t0 = ac.currentTime, d = sfxG;
  switch(n){
    case 'click': tone(700, t0, .05, 'square', .08, d); break;
    case 'blip': tone(900 + Math.random()*300, t0, .06, 'sine', .1, d, 1500); break;
    case 'pop': tone(520, t0, .09, 'square', .1, d, 1040); tone(1040, t0 + .05, .1, 'square', .08, d, 1560); break;
    case 'star': [0,4,7,12].forEach((k,j) => tone(mf(84 + k), t0 + j*.05, .12, 'square', .08, d)); break;
    case 'dash': noise(t0, .2, .3, d, 900); tone(260, t0, .16, 'sawtooth', .05, d, 800); break;
    case 'bonk': tone(190, t0, .18, 'sine', .5, d, 60); noise(t0, .05, .18, d, 2000); break;
    case 'chomp': tone(420, t0, .08, 'square', .14, d, 120); tone(320, t0 + .1, .1, 'square', .14, d, 90); break;
    case 'out': tone(760, t0, .55, 'triangle', .25, d, 90); break;
    case 'tick': tone(660, t0, .1, 'square', .1, d); break;
    case 'go': tone(990, t0, .3, 'square', .12, d); tone(1485, t0, .3, 'square', .06, d); break;
    case 'win': [72,76,79,84].forEach((m,j) => tone(mf(m), t0 + j*.09, .2, 'square', .09, d)); break;
    case 'fanfare': [[72,0],[72,.12],[72,.24],[76,.36],[79,.6],[84,.84]].forEach(([m,o]) => tone(mf(m), t0 + o, .32, 'square', .09, d)); break;
    case 'coin': tone(mf(83), t0, .08, 'square', .09, d); tone(mf(88), t0 + .08, .3, 'square', .09, d); break;
    case 'spin': tone(1300, t0, .025, 'square', .05, d); break;
  }
}
document.addEventListener('click', e => { if(e.target.closest('button') || e.target.closest('.hand')) sfx('click'); }, true);

    const d = document.documentElement;
    if(!document.fullscreenElement && d.requestFullscreen){
      d.requestFullscreen().then(() => { try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>{});

}
function resetInput(){ ptrs.clear(); pads.forEach(p => { p.id = null; p.press = 0; }); }
function toMenu(){
  state = 'menu'; match = null; players = []; parts = []; resetInput();
  $('home').classList.remove('hidden'); $('end').classList.add('hidden'); $('quit').classList.add('hidden');
  refreshHome();
}
function startMatch(order, n){
  match = {order, idx:0, wins:new Array(n).fill(0), n};
  resetInput();
  $('home').classList.add('hidden'); $('end').classList.add('hidden'); $('quit').classList.remove('hidden');
  startRound();
}

function spawnPos(i, n){
  if(mode === 'sumo'){
    const a = n === 2 ? (i ? 0 : Math.PI) : (Math.PI*2/n)*i + Math.PI*.75;
    return {x: CX + Math.cos(a)*170, y: CY + Math.sin(a)*170};
  }
  if(n === 2) return i === 0 ? {x:220,y:CY} : {x:980,y:CY};
  return [{x:200,y:480},{x:1000,y:480},{x:200,y:195},{x:1000,y:195}][i];
}
function startRound(){
  mode = match.order[match.idx];
  players = [];
  for(let i=0;i<match.n;i++){
    const sp = spawnPos(i, match.n);
    const fx = CX - sp.x, fy = CY - sp.y, fl = Math.hypot(fx,fy) || 1;
    players.push({i, x:sp.x, y:sp.y, vx:0, vy:0, m: mode === 'eat' ? 900 : 1600, score:0, alive:true, fall:0, fallMax:.6,
      cx:0, cy:0, fx:fx/fl, fy:fy/fl, dashCd:0, dashMax:1, dashFx:0, seed:rnd(0,9), blink:rnd(1,3), scared:false, won:false, expr:'normal'});
  }
  food = []; parts = [];
  if(mode === 'eat') for(let i=0;i<100;i++) food.push(newFood());
  if(mode === 'food') for(let i=0;i<12;i++) food.push(newFood());
  arenaR = 300; elapsed = 0; tLeft = MODES[mode].time; tCount = 3.2; tickPrev = 4; state = 'count';
}
function newFood(){
  return {x: rnd(30,WW-30), y: rnd(30,WH-30), col: ['#e8735a','#f2c94c','#6aa6d8','#7cc47a','#c58fd6'][Math.floor(rnd(0,5))], v: (mode === 'food' && Math.random() < .14) ? 3 : 1, ph: rnd(0,6)};
}

// ---------- Kontrol ----------
// Tiap pemain punya "pad": joystick mengambang + tombol DASH tetap di pojoknya.
const pads = [0,1,2,3].map(() => ({id:null, ox:0, oy:0, px:0, py:0, t0:0, moved:false, press:0}));
const ptrs = new Map();               // pointerId -> {z, kind:'joy'|'btn'|'extra', x, y}
const JR = () => Math.max(42, Math.min(W,H)*.11) * SIZE[save.size];   // radius joystick
const BR = () => Math.max(32, Math.min(W,H)*.085) * SIZE[save.size];  // radius tombol dash
function btnPos(z){
  const m = BR() + 14;
  if(save.dashPos === 'in') return [{x:W/2-m,y:H-m},{x:W/2+m,y:H-m},{x:W/2-m,y:m+58},{x:W/2+m,y:m+58}][z];
  return [{x:m,y:H-m},{x:W-m,y:H-m},{x:m,y:m},{x:W-m,y:m}][z];
}
function zoneOf(x, y){
  const n = match ? match.n : 2;
  if(n === 2) return x < W/2 ? 0 : 1;
  const z = y < H/2 ? (x < W/2 ? 2 : 3) : (x < W/2 ? 0 : 1);
  return z < n ? z : -1;
}
const inputOn = () => match && (state === 'count' || state === 'play' || state === 'end');
function startJoy(pad, id, x, y){ pad.id = id; pad.ox = pad.px = x; pad.oy = pad.py = y; pad.t0 = performance.now(); pad.moved = false; }

cv.addEventListener('pointerdown', e => {
  if(!inputOn()) return;
  e.preventDefault();
  const z = zoneOf(e.clientX, e.clientY); if(z < 0 || !players[z]) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const pad = pads[z], b = btnPos(z), o = {z, kind:'joy', x:e.clientX, y:e.clientY};
  if(Math.hypot(e.clientX-b.x, e.clientY-b.y) < BR()*1.3){ o.kind = 'btn'; pad.press = .15; dash(players[z]); }
  else if(pad.id === null) startJoy(pad, e.pointerId, e.clientX, e.clientY);
  else { o.kind = 'extra'; dash(players[z]); }     // jari kedua di area sendiri = dash
  ptrs.set(e.pointerId, o);
});
cv.addEventListener('pointermove', e => {
  const o = ptrs.get(e.pointerId); if(!o) return;
  o.x = e.clientX; o.y = e.clientY;
  if(o.kind !== 'joy') return;
  const pad = pads[o.z];
  pad.px = o.x; pad.py = o.y;
  const dx = pad.px-pad.ox, dy = pad.py-pad.oy, l = Math.hypot(dx,dy);
  if(l > 12) pad.moved = true;
  const lim = JR()*1.4;                      // pangkal joystick ikut jari kalau terlalu jauh
  if(l > lim){ pad.ox = pad.px - dx/l*lim; pad.oy = pad.py - dy/l*lim; }
});
function release(e){
  const o = ptrs.get(e.pointerId); if(!o) return;
  ptrs.delete(e.pointerId);
  if(o.kind !== 'joy') return;
  const pad = pads[o.z];
  if(e.type === 'pointerup' && !pad.moved && performance.now()-pad.t0 < 220 && players[o.z]) dash(players[o.z]);  // ketuk cepat = dash
  pad.id = null;
  for(const [id,q] of ptrs){                 // jari lain di area yang sama mengambil alih joystick
    if(q.z === o.z && q.kind === 'extra'){ q.kind = 'joy'; startJoy(pad, id, q.x, q.y); pad.moved = true; break; }
  }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);
addEventListener('contextmenu', e => e.preventDefault());

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(state !== 'play') return;
  if(e.code === 'Space' && players[0]) dash(players[0]);
  if((e.code === 'Enter' || e.code === 'ShiftRight') && players[1]) dash(players[1]);
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });

function readCtrl(p){
  const pad = pads[p.i];
  p.cx = p.cy = 0;
  if(pad.id !== null){
    const dx = pad.px-pad.ox, dy = pad.py-pad.oy, l = Math.hypot(dx,dy), dead = 8, R = JR();
    if(l > dead){ const m = Math.min(1, (l-dead)/(R-dead)); p.cx = dx/l*m; p.cy = dy/l*m; }
  } else if(p.i < 2){
    const k = p.i === 0 ? ['KeyA','KeyD','KeyW','KeyS'] : ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
    const x = (keys[k[1]]?1:0) - (keys[k[0]]?1:0), y = (keys[k[3]]?1:0) - (keys[k[2]]?1:0);
    if(x || y){ const l = Math.hypot(x,y); p.cx = x/l; p.cy = y/l; }
  }
}
const canDash = p => p.alive && p.dashCd <= 0 && !(mode === 'eat' && p.m < 400);
function dash(p){
  if(state !== 'play' || !canDash(p)) return;
  if(mode === 'eat') p.m *= .94;
  let dx = p.fx, dy = p.fy;
  const cl = Math.hypot(p.cx,p.cy);
  if(cl > .2){ dx = p.cx/cl; dy = p.cy/cl; }
  const imp = mode === 'sumo' ? 560 : mode === 'eat' ? 520 : 600;
  p.vx += dx*imp; p.vy += dy*imp; p.fx = dx; p.fy = dy;
  p.dashMax = p.dashCd = mode === 'sumo' ? 1.1 : .8; p.dashFx = .3; sfx('dash');
  const r = rad(p);
  for(let k=0;k<6;k++) parts.push({type:'line', x:p.x - dx*r*rnd(1,1.6) + rnd(-r,r)*-dy, y:p.y - dy*r*rnd(1,1.6) + rnd(-r,r)*dx, dx, dy, len:rnd(20,45), life:.3, max:.3});
  buzz(15);
}
function buzz(ms){ if(!save.vib) return; try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

// ---------- Efek ----------
function burst(x, y, col, n, spd){
  for(let i=0;i<n;i++){ const a = rnd(0,6.28), s = rnd(spd*.4, spd);
    parts.push({type:'spark', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(.35,.7), max:.7, col, sz:rnd(5,10), rot:rnd(0,6)}); }
}
function popText(x, y, txt, col, sz){ parts.push({type:'text', x, y, vx:0, vy:-70, life:.9, max:.9, txt, col, sz}); }
function updateParts(dt){
  for(const q of parts){ q.life -= dt; if(q.vx !== undefined){ q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .92; q.vy *= .92; } }
  parts = parts.filter(q => q.life > 0);
  if(parts.length > 300) parts.splice(0, parts.length-300);
}

// ---------- Update ----------
const rad = p => Math.sqrt(p.m);
function params(p){
  if(mode === 'eat') return {ms: 280*Math.pow(rad(p)/30, -0.35), k:6};
  if(mode === 'sumo') return {ms:260, k:3.4};
  return {ms:290, k:5};
}

function update(dt){
  T += dt;
  shake *= Math.exp(-10*dt);
  updateParts(dt);
  for(const p of pads) p.press = Math.max(0, p.press-dt);
  for(const p of players){
    p.blink -= dt; if(p.blink < -.12) p.blink = rnd(2,4.5);
    if(!p.alive){ p.fall = Math.max(0, p.fall-dt); p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= Math.exp(-2*dt); p.vy *= Math.exp(-2*dt); }
    p.expr = !p.alive ? 'dead' : p.won ? 'happy' : p.dashFx > 0 ? 'dash' : p.scared ? 'scared' : p.blink < 0 ? 'blink' : 'normal';
  }
  if(state === 'count'){
    tCount -= dt; const c = Math.ceil(tCount);
    if(c !== tickPrev){ tickPrev = c; if(c >= 1 && c <= 3) sfx('tick'); }
    if(tCount <= 0){ state = 'play'; sfx('go'); }
    return;
  }
  if(state === 'end'){
    tEnd -= dt;
    if(tEnd <= 0){ match.idx++; if(match.idx >= match.order.length) finishMatch(); else startRound(); }
    return;
  }
  if(state !== 'play') return;
  elapsed += dt; if(MODES[mode].time) tLeft -= dt;

  for(const p of players){
    if(!p.alive) continue;
    readCtrl(p);
    const cl = Math.hypot(p.cx,p.cy);
    if(cl > .2){ p.fx = p.cx/cl; p.fy = p.cy/cl; }
    const {ms,k} = params(p);
    p.vx += p.cx*ms*k*dt; p.vy += p.cy*ms*k*dt;
    const f = Math.exp(-k*dt); p.vx *= f; p.vy *= f;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.dashCd = Math.max(0, p.dashCd-dt); p.dashFx = Math.max(0, p.dashFx-dt);
    p.scared = false;
  }

  if(mode === 'sumo'){
    if(elapsed > 3) arenaR = Math.max(60, 300 - (elapsed-3)*3.6);
    collide(.9);
    for(const p of players){
      if(!p.alive) continue;
      const d = Math.hypot(p.x-CX, p.y-CY), r = rad(p);
      if(d > arenaR - r*.8) p.scared = true;
      if(d > arenaR + r*.3){
        p.alive = false; p.fall = p.fallMax = .6; shake = 12; buzz(60); sfx('out');
        popText(p.x, p.y - r, 'OUT!', CHARS[p.i].d, 34); burst(p.x, p.y, CHARS[p.i].c, 14, 260);
      }
    }
  } else {
    for(const p of players){
      if(!p.alive) continue;
      const r = rad(p);
      if(p.x < r){ p.x = r; p.vx = Math.abs(p.vx)*.3; } if(p.x > WW-r){ p.x = WW-r; p.vx = -Math.abs(p.vx)*.3; }
      if(p.y < r){ p.y = r; p.vy = Math.abs(p.vy)*.3; } if(p.y > WH-r){ p.y = WH-r; p.vy = -Math.abs(p.vy)*.3; }
    }
    if(mode === 'food') collide(.7);
    for(const p of players){
      if(!p.alive) continue;
      const r = rad(p);
      for(let i=0;i<food.length;i++){
        const f = food[i], fr = mode === 'food' ? (f.v > 1 ? 20 : 16) : 6;
        if(Math.hypot(f.x-p.x, f.y-p.y) < r + fr*.6){
          if(mode === 'eat'){ p.m += 16; sfx('blip'); if(Math.random() < .3) burst(f.x, f.y, f.col, 3, 90); }
          else { p.score += f.v; sfx(f.v > 1 ? 'star' : 'pop'); burst(f.x, f.y, f.v > 1 ? '#f2c94c' : '#fff', f.v > 1 ? 12 : 6, 200); popText(f.x, f.y-14, '+' + f.v, f.v > 1 ? '#b88a12' : CHARS[p.i].d, f.v > 1 ? 26 : 20); }
          food[i] = newFood();
        }
      }
      if(mode === 'eat' && p.m > 3000) p.m -= p.m*.005*dt;
    }
    if(mode === 'eat'){
      for(const a of players) for(const b of players){
        if(a === b || !a.alive || !b.alive) continue;
        const ra = rad(a), rb = rad(b), d = Math.hypot(a.x-b.x, a.y-b.y);
        if(ra > rb*1.1){
          if(d < ra + rb + 120) b.scared = true;
          if(d < ra - rb*.35){
            a.m += b.m*.85; b.alive = false; b.fall = b.fallMax = .35;
            b.vx = (a.x-b.x)*3; b.vy = (a.y-b.y)*3;
            shake = 10; buzz(60); sfx('chomp');
            popText(a.x, a.y - ra, 'NYAM!', CHARS[a.i].d, 30); burst(b.x, b.y, CHARS[b.i].c, 14, 240);
          }
        }
      }
    }
  }
  checkRoundEnd();
}

function collide(rest){
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    const a = players[i], b = players[j];
    if(!a.alive || !b.alive) continue;
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || .001, min = rad(a)+rad(b);
    if(d < min){
      const nx = dx/d, ny = dy/d, ov = (min-d)/2;
      a.x -= nx*ov; a.y -= ny*ov; b.x += nx*ov; b.y += ny*ov;
      const rel = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
      if(rel > 0){
        const imp = (1+rest)*rel/2;
        a.vx -= imp*nx; a.vy -= imp*ny; b.vx += imp*nx; b.vy += imp*ny;
        if(rel > 260){
          const hx = a.x + nx*rad(a), hy = a.y + ny*rad(a);
          burst(hx, hy, '#fff', 8, 220); shake = Math.max(shake, 6); buzz(25); sfx('bonk');
          if(rel > 420) popText(hx, hy - 20, Math.random() < .5 ? 'BONK!' : 'DUAK!', '#b54a33', 26);
        }
      }
    }
  }
}

function checkRoundEnd(){
  const alive = players.filter(p => p.alive);
  let winners = null;
  if(mode === 'sumo'){ if(alive.length <= 1) winners = alive; }
  else if(mode === 'eat'){
    if(alive.length <= 1) winners = alive;
    else if(tLeft <= 0){ const mx = Math.max(...alive.map(p => p.m)); winners = alive.filter(p => p.m === mx); }
  } else if(tLeft <= 0){
    const mx = Math.max(...players.map(p => p.score)); winners = mx > 0 ? players.filter(p => p.score === mx) : [];
  }
  if(!winners) return;
  for(const w of winners){ match.wins[w.i]++; save.wins[w.i]++; save.stars++; w.won = true; burst(w.x, w.y, '#f2c94c', 18, 300); }
  endText = winners.length === 0 ? t('draw') : winners.length === 1 ? CHARS[winners[0].i].n + t('win') : t('drawW') + winners.map(w => CHARS[w.i].n).join(' & ');
  endCol = winners.length === 1 ? CHARS[winners[0].i].c : '#fff';
  state = 'end'; tEnd = 2.8; sfx('win');
}

function finishMatch(){
  state = 'over';
  const mx = Math.max(...match.wins);
  const champs = match.wins.map((w,i) => w === mx ? i : -1).filter(i => i >= 0);
  for(const p of players) p.won = champs.includes(p.i) && mx > 0;
  sfx('fanfare'); save.matches++; if(mx > 0 && champs.length === 1) save.trophies[champs[0]]++; persist();
  $('champ').textContent = mx === 0 ? t('allDraw') : champs.length === 1 ? '🏆 ' + CHARS[champs[0]].n + t('champ') : '🤝 ' + t('drawW') + champs.map(i => CHARS[i].n).join(' & ');
  $('tab').innerHTML = match.wins.map((w,i) => `<span style="color:${CHARS[i].d}">${CHARS[i].n}</span>: ${'★'.repeat(w) || '–'}`).join('<br>');
  $('end').classList.remove('hidden'); $('quit').classList.add('hidden');
  resetInput();
}

// ---------- Gambar karakter ----------
function wobbly(x, y, r, seed, amp){
  const TB = Math.floor(T*8)/8;   // garis 'bergetar' seperti animasi gambar tangan
  ctx.beginPath();
  const N = 30;
  for(let i=0;i<=N;i++){
    const a = i/N*6.2832, w = 1 + amp*(Math.sin(a*3+seed+TB*7.3)*.6 + Math.sin(a*5-seed*1.7+TB*11.1)*.4);
    const px = x + Math.cos(a)*r*w, py = y + Math.sin(a)*r*w;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function inkStroke(w){ ctx.lineWidth = w; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }

function accessoryBack(ch, r){
  const lw = Math.max(2, r*.06);
  if(ch.acc === 'ears'){
    for(const s of [-1,1]){
      const a1 = -Math.PI/2 + s*.3, a2 = -Math.PI/2 + s*1.0, at = -Math.PI/2 + s*.62;
      const P = a => [Math.cos(a)*r*.85, Math.sin(a)*r*.85];
      const p1 = P(a1), p2 = P(a2), tip = [Math.cos(at)*r*1.5, Math.sin(at)*r*1.5];
      ctx.beginPath(); ctx.moveTo(...p1); ctx.lineTo(...tip); ctx.lineTo(...p2); ctx.closePath();
      ctx.fillStyle = ch.c; ctx.fill(); inkStroke(lw);
      const cx = (p1[0]+p2[0]+tip[0])/3, cy = (p1[1]+p2[1]+tip[1])/3, k = .5;
      ctx.beginPath(); [p1,tip,p2].forEach((q,i) => { const x = cx+(q[0]-cx)*k, y = cy+(q[1]-cy)*k + r*.05; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      ctx.closePath(); ctx.fillStyle = '#f3b4a6'; ctx.fill();
    }
  } else if(ch.acc === 'ahoge'){
    ctx.beginPath(); ctx.moveTo(-r*.08, -r*.9);
    ctx.quadraticCurveTo(-r*.2, -r*1.55, r*.38, -r*1.5);
    ctx.quadraticCurveTo(r*.02, -r*1.38, r*.1, -r*.9);
    ctx.closePath(); ctx.fillStyle = ch.c; ctx.fill(); inkStroke(lw);
  } else if(ch.acc === 'leaf'){
    ctx.beginPath(); ctx.moveTo(0, -r*.9); ctx.quadraticCurveTo(-r*.05, -r*1.15, r*.02, -r*1.3); inkStroke(lw);
    ctx.save(); ctx.translate(r*.22, -r*1.35); ctx.rotate(-.5);
    ctx.beginPath(); ctx.ellipse(0, 0, r*.26, r*.12, 0, 0, 7); ctx.fillStyle = '#9ccc7a'; ctx.fill(); inkStroke(lw*.8);
    ctx.beginPath(); ctx.moveTo(-r*.2, 0); ctx.lineTo(r*.18, 0); inkStroke(lw*.5);
    ctx.restore();
  }
}
function accessoryFront(ch, r){
  if(ch.acc !== 'bow') return;
  const lw = Math.max(2, r*.055);
  ctx.save(); ctx.translate(r*.45, -r*.72); ctx.rotate(.35);
  for(const s of [-1,1]){
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*r*.38, -r*.2); ctx.lineTo(s*r*.38, r*.2); ctx.closePath();
    ctx.fillStyle = '#e8735a'; ctx.fill(); inkStroke(lw);
  }
  ctx.beginPath(); ctx.arc(0, 0, r*.1, 0, 7); ctx.fillStyle = '#e8735a'; ctx.fill(); inkStroke(lw);
  ctx.restore();
}

function drawFace(p, r, ch){
  const gx = p.fx*r*.16, gy = p.fy*r*.12, ex = r*.3, ey = -r*.1, lw = Math.max(2, r*.065);
  const e = p.expr;
  for(const s of [-1,1]){
    const cx = gx + s*ex, cy = gy + ey, ew = r*.16, eh = r*.2;
    ctx.beginPath();
    if(e === 'dead'){
      ctx.moveTo(cx-ew*.8, cy-ew*.8); ctx.lineTo(cx+ew*.8, cy+ew*.8); ctx.moveTo(cx+ew*.8, cy-ew*.8); ctx.lineTo(cx-ew*.8, cy+ew*.8); inkStroke(lw);
    } else if(e === 'happy'){
      ctx.arc(cx, cy + r*.07, ew, Math.PI*1.1, Math.PI*1.9); inkStroke(lw);
    } else if(e === 'dash'){
      ctx.moveTo(cx - s*ew, cy - eh*.6); ctx.lineTo(cx + s*ew*.8, cy); ctx.lineTo(cx - s*ew, cy + eh*.6); inkStroke(lw);
    } else if(e === 'blink'){
      ctx.moveTo(cx-ew, cy+eh*.1); ctx.quadraticCurveTo(cx, cy+eh*.5, cx+ew, cy+eh*.1); inkStroke(lw);
    } else {
      const big = e === 'scared' ? 1.2 : 1;
      ctx.ellipse(cx, cy, ew*big, eh*big, 0, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); inkStroke(lw*.85);
      const pr = e === 'scared' ? ew*.28 : ew*.5;
      ctx.beginPath(); ctx.arc(cx + p.fx*ew*.38, cy + p.fy*eh*.32, pr, 0, 7); ctx.fillStyle = INK; ctx.fill();
    }
  }
  const my = gy + r*.25;
  ctx.beginPath();
  if(e === 'happy'){
    ctx.arc(gx, my - r*.03, r*.12, 0, Math.PI); ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
  } else if(e === 'dash' || e === 'scared'){
    ctx.ellipse(gx, my, r*.06, r*.08, 0, 0, 7); ctx.fillStyle = INK; ctx.fill();
  } else if(e === 'dead'){
    ctx.moveTo(gx - r*.12, my); for(let i=1;i<=4;i++) ctx.lineTo(gx - r*.12 + i*r*.06, my + (i%2 ? -r*.04 : 0)); inkStroke(lw*.8);
  } else {
    ctx.moveTo(gx - r*.08, my - r*.01); ctx.quadraticCurveTo(gx, my + r*.06, gx + r*.08, my - r*.01); inkStroke(lw*.8);
  }
  if(e === 'scared'){
    const sx = r*.7, sy = -r*.5;
    ctx.beginPath(); ctx.moveTo(sx, sy - r*.2); ctx.quadraticCurveTo(sx + r*.13, sy, sx, sy + r*.06); ctx.quadraticCurveTo(sx - r*.13, sy, sx, sy - r*.2);
    ctx.fillStyle = '#a9d3f0'; ctx.fill(); inkStroke(lw*.6);
  }
}

function drawChar(p){
  let r = rad(p), spin = 0;
  const ch = CHARS[p.i];
  if(!p.alive){ if(p.fall <= 0) return; const k = p.fall/p.fallMax; r *= k; spin = (1-k)*7; if(r < 1) return; }
  const sp = Math.hypot(p.vx,p.vy), st = Math.min(.16, sp/3000), ang = Math.atan2(p.vy, p.vx);
  const bob = Math.sin(T*6 + p.i*1.7)*.03;
  // bayangan
  ctx.beginPath(); ctx.ellipse(p.x + r*.1, p.y + r*.92, r*.78, r*.2, 0, 0, 7); ctx.fillStyle = 'rgba(38,35,34,.16)'; ctx.fill();
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(ang); ctx.scale(1+st, 1-st); ctx.rotate(-ang + spin);
  ctx.scale(1-bob, 1+bob);
  accessoryBack(ch, r);
  wobbly(0, 0, r, p.seed, .03);
  ctx.fillStyle = ch.c; ctx.fill();
  ctx.save(); ctx.clip();                                         // bayangan arsir
  ctx.beginPath(); ctx.rect(-r*2, -r*2, r*4, r*4); ctx.arc(-r*.2, -r*.22, r*1.0, 0, 7, true); ctx.clip();
  ctx.globalAlpha = .3; ctx.fillStyle = ch.d; ctx.fillRect(-r*2, -r*2, r*4, r*4); ctx.globalAlpha = 1;
  ctx.beginPath(); const hs = Math.max(4, r*.15);
  for(let k = -r*2; k < r*2; k += hs){ ctx.moveTo(k, r*1.3); ctx.lineTo(k + r*1.7, -r*.4); }
  ctx.lineWidth = Math.max(1.2, r*.035); ctx.strokeStyle = 'rgba(38,35,34,.6)'; ctx.stroke();
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-r*.55, -r*.35); ctx.quadraticCurveTo(-r*.5, -r*.6, -r*.25, -r*.68); inkStroke(Math.max(1.5, r*.04)); // garis kilap
  wobbly(0, 0, r, p.seed, .03); inkStroke(Math.max(3, r*.085));
  accessoryFront(ch, r);
  drawFace(p, r, ch);
  ctx.restore();
}

// ---------- Gambar makanan ----------
function drawFood(f){
  const bob = Math.sin(T*3 + f.ph)*3;
  if(mode === 'eat'){
    ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 7); ctx.fillStyle = f.col; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    return;
  }
  ctx.save(); ctx.translate(f.x, f.y + bob);
  if(f.v > 1){
    ctx.rotate(T*1.5 + f.ph);
    ctx.beginPath();
    for(let i=0;i<=10;i++){ const a = -Math.PI/2 + i*Math.PI/5, r = i%2 ? 9 : 21; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
    ctx.closePath(); ctx.fillStyle = '#f2c94c'; ctx.fill(); inkStroke(3);
    ctx.fillStyle = INK; ctx.fillRect(-5, -3, 2.5, 5); ctx.fillRect(3, -3, 2.5, 5);
  } else {
    ctx.beginPath(); ctx.moveTo(0, -17); ctx.quadraticCurveTo(5, -16, 17, 6); ctx.quadraticCurveTo(19, 13, 10, 13);
    ctx.lineTo(-10, 13); ctx.quadraticCurveTo(-19, 13, -17, 6); ctx.quadraticCurveTo(-5, -16, 0, -17); ctx.closePath();
    ctx.fillStyle = '#fff'; ctx.fill(); inkStroke(3);
    ctx.fillStyle = '#2d3b3a'; ctx.fillRect(-7, 2, 14, 11); ctx.strokeRect(-7, 2, 14, 11);
  }
  ctx.restore();
}

// ---------- Render ----------
function drawArena(){
  ctx.drawImage(paper, 0, 0);
  if(mode === 'sumo'){
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,WW,WH); ctx.arc(CX, CY, arenaR, 0, 7, true); ctx.clip();
    ctx.strokeStyle = 'rgba(181,74,51,.13)'; ctx.lineWidth = 2.5; ctx.beginPath();
    for(let x=-WH; x<WW; x+=36){ ctx.moveTo(x, WH); ctx.lineTo(x+WH, 0); }
    ctx.stroke(); ctx.restore();
    wobbly(CX, CY, arenaR, 1.3, .006); ctx.fillStyle = '#f7ecc8'; ctx.fill();
    ctx.setLineDash([18,10]); ctx.beginPath(); ctx.arc(CX, CY, Math.max(10, arenaR-14), 0, 7); ctx.lineWidth = 5; ctx.strokeStyle = '#e2b33c'; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(CX-50, CY-14, 8, 28); ctx.fillRect(CX+42, CY-14, 8, 28);
    wobbly(CX, CY, arenaR, 1.3, .006); inkStroke(8);
    ctx.globalAlpha = .4; wobbly(CX+2, CY-2, arenaR+4, 3.1, .01); inkStroke(2.5); ctx.globalAlpha = 1;
  } else {
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#f2c94c'; ctx.lineWidth = 7; ctx.strokeRect(9, 9, WW-18, WH-18);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.strokeRect(0, 0, WW, WH);
    ctx.globalAlpha = .45; ctx.lineWidth = 2; ctx.strokeRect(-5, 3, WW+8, WH-7); ctx.globalAlpha = 1;
  }
}
function star4(x, y, s, rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath();
  for(let i=0;i<8;i++){ const a = i*Math.PI/4, r = i%2 ? s*.35 : s; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); }
  ctx.closePath(); ctx.restore();
}
function drawParts(){
  for(const q of parts){
    const k = q.life/q.max;
    if(q.type === 'spark'){ star4(q.x, q.y, q.sz*k, q.rot + T*4); ctx.fillStyle = q.col; ctx.fill(); ctx.globalAlpha = k; inkStroke(1.5); ctx.globalAlpha = 1; }
    else if(q.type === 'line'){ ctx.globalAlpha = k; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.dx*q.len, q.y - q.dy*q.len); inkStroke(3); ctx.globalAlpha = 1; }
    else if(q.type === 'text'){
      const sc = 1 + Math.max(0, (k-.8))*2.5;
      ctx.save(); ctx.translate(q.x, q.y); ctx.scale(sc, sc); ctx.rotate(-.06); ctx.globalAlpha = Math.min(1, k*2);
      ctx.font = font(q.sz); const w = ctx.measureText(q.txt).width + 22, h = q.sz + 14;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-w/2, -h/2, w, h, h/2) : ctx.rect(-w/2, -h/2, w, h);
      ctx.moveTo(-6, h/2 - 1); ctx.lineTo(0, h/2 + 10); ctx.lineTo(6, h/2 - 1);
      ctx.fillStyle = '#fff'; ctx.fill(); inkStroke(3);
      ctx.fillStyle = '#fff'; ctx.fillRect(-5, h/2 - 4, 10, 4);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = q.col; ctx.fillText(q.txt, 0, 1);
      ctx.restore();
    }
  }
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.save();
  ctx.translate(OX + (Math.random()-.5)*shake, OY + (Math.random()-.5)*shake); ctx.scale(S,S);
  drawArena();
  for(const f of food) drawFood(f);
  [...players].sort((a,b) => a.m - b.m || a.y - b.y).forEach(drawChar);
  drawParts();
  ctx.restore();
  if(match) hud();
}

function tag(x, y, text, col, size, align){
  ctx.font = font(size); const w = ctx.measureText(text).width + 16, h = size + 10;
  const x0 = align === 'left' ? x : align === 'right' ? x - w : x - w/2;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x0, y - h/2, w, h, 8) : ctx.rect(x0, y - h/2, w, h);
  ctx.fillStyle = '#f7f5ef'; ctx.fill(); inkStroke(2);
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x0 + w/2, y + 1);
}
function bigText(txt, y, size, col){
  ctx.font = font(size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size*.16; ctx.strokeStyle = INK; ctx.strokeText(txt, W/2, y);
  ctx.fillStyle = col; ctx.fillText(txt, W/2, y);
}

function hud(){
  // garis pembagi area (pensil)
  ctx.save(); ctx.strokeStyle = 'rgba(38,35,34,.25)'; ctx.lineWidth = 2; ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(W/2, 30); ctx.lineTo(W/2, H);
  if(match.n > 2){ ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); }
  ctx.stroke(); ctx.restore();

  const R = BR();
  for(const p of players){
    const ch = CHARS[p.i], b = btnPos(p.i), top = p.i >= 2, pad = pads[p.i];
    // joystick
    if(pad.id !== null){
      const jr = JR();
      ctx.beginPath(); ctx.arc(pad.ox, pad.oy, jr, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fill();
      ctx.setLineDash([5,6]); inkStroke(2.5); ctx.setLineDash([]);
      let kx = pad.px - pad.ox, ky = pad.py - pad.oy; const kl = Math.hypot(kx,ky);
      if(kl > jr){ kx = kx/kl*jr; ky = ky/kl*jr; }
      ctx.beginPath(); ctx.arc(pad.ox + kx, pad.oy + ky, jr*.42, 0, 7); ctx.fillStyle = ch.c; ctx.fill(); inkStroke(3);
    }
    // tombol dash
    ctx.save(); ctx.translate(b.x, b.y); if(top) ctx.rotate(Math.PI);
    const sc = pad.press > 0 ? .88 : 1; ctx.scale(sc, sc);
    const ready = canDash(p) && state === 'play';
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fillStyle = ready ? ch.c : '#d9d2c3'; ctx.fill();
    if(p.dashCd > 0){ ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0, 0, R, -Math.PI/2, -Math.PI/2 + Math.PI*2*(p.dashCd/p.dashMax)); ctx.closePath(); ctx.fillStyle = 'rgba(38,35,34,.3)'; ctx.fill(); }
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); inkStroke(3);
    ctx.font = font(Math.round(R*.42)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = INK; ctx.fillText('DASH', 0, 1);
    // label pemain
    const dir = ((p.i === 0 || p.i === 3) ? 1 : -1) * (save.dashPos === 'in' ? -1 : 1);
    const live = mode === 'eat' ? Math.floor(p.m/10) : mode === 'food' ? p.score + ' ' + t('pts') : (p.alive ? t('safe') : t('fell'));
    tag(dir*(R+10), R*.45, `${ch.n} ${'★'.repeat(match.wins[p.i]) || '·'} ${live}`, ch.d, 13, dir > 0 ? 'left' : 'right');
    ctx.restore();
  }
  // judul ronde & waktu
  const tm = MODES[mode].time ? '  ⏱' + Math.max(0, Math.ceil(tLeft)) : '';
  tag(W/2, 44, `${MODES[mode].name}${tm}`, INK, 15, 'center');
  ctx.font = font(10); ctx.fillStyle = 'rgba(38,35,34,.7)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${t('round')} ${Math.min(match.idx+1, match.order.length)}/${match.order.length}`, W/2, 66);

  if(state === 'count'){
    const n = Math.ceil(tCount);
    const pop = 1 + (tCount % 1)*.35;
    ctx.save(); ctx.translate(W/2, H/2 - 10); ctx.scale(pop, pop); ctx.translate(-W/2, -(H/2 - 10));
    bigText(tCount > .2 ? String(n) : t('start'), H/2 - 10, 64, tCount > .2 ? '#ffcb47' : '#5fd68a');
    ctx.restore();
    bigText(MODES[mode].hint, H/2 + 42, 16, '#fff');
  }
  if(state === 'end') bigText(endText, H/2, 38, endCol);
}

// ---------- Hero halaman utama: trofi doodle + karakter + konfeti ----------
const menuChars = CHARS.map((c,i) => ({i, x:0, y:0, vx:0, vy:0, m:100, alive:true, fall:0, fallMax:1, fx:0, fy:1, seed:i*2.3, expr:'happy', blink:rnd(1,3), dashFx:0}));

function renderMenu(dt){
  T += dt;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(bg, 0, 0, W, H);
  const hx = W*.3, hy = H*.53, u = Math.min(W*.46, H*.9)/100;

  ctx.restore();
  // pulau kertas
  ctx.save(); ctx.translate(hx, hy + u*26); ctx.scale(1, .32);
  wobbly(0, 0, u*46, 2.2, .02); ctx.fillStyle = '#f4f2ec'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(hx, hy + u*26); ctx.scale(1, .32); wobbly(0, 0, u*46, 2.2, .02); ctx.restore(); inkStroke(3);
  ctx.strokeStyle = 'rgba(38,35,34,.4)'; ctx.lineWidth = 1.6;
  for(let i=0;i<9;i++) tuft(ctx, hx + Math.cos(i*2.1)*u*34, hy + u*26 + Math.sin(i*2.1)*u*9, u*2);
  drawTrophy(hx, hy - u*4 + Math.sin(T*2)*u*1.2, u*46);
  // karakter bersorak
  const pos = [[-28,24],[28,24],[-37,2],[37,2]];
  for(const c of menuChars){
    c.blink -= dt; if(c.blink < -.12) c.blink = rnd(2,4);
    const jump = Math.max(0, Math.sin(T*4 + c.i*1.3))*u*5;
    c.m = (u*9.5)**2; c.x = hx + pos[c.i][0]*u; c.y = hy + pos[c.i][1]*u - jump;
    c.fx = (hx - c.x)/(u*40); c.fy = -.4;
    c.expr = jump > u*2 ? 'happy' : c.blink < 0 ? 'blink' : 'normal';
  }
  [...menuChars].sort((a,b) => a.y - b.y).forEach(drawChar);
  // konfeti
  for(const q of confetti){
    q.y += q.v*dt; q.r += q.vr*dt; if(q.y > 1.05){ q.y = -.05; q.x = Math.random()*.6; }
    ctx.save(); ctx.translate(q.x*W, q.y*H + Math.sin(T*2 + q.r)*4); ctx.rotate(q.r); ctx.scale(q.s, q.s*Math.abs(Math.cos(q.r*1.3)) + .2);
    ctx.beginPath(); ctx.rect(-5,-4,10,8); ctx.fillStyle = q.c; ctx.fill(); inkStroke(1.5); ctx.restore();
  }
}
refreshHome();

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  setSong(state === 'menu' || !match ? 'menu' : 'game'); musicTick();
  if(state === 'menu' || !match) renderMenu(dt);
  else { update(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
