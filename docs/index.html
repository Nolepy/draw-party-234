<style>
  :root{--ink:#110a02;--paper:#f2eee3}
  html,body{margin:0;height:100%;overflow:hidden;background:#f2eee3;font-family:'Pixelify Sans',monospace;font-weight:600;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #c{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box;background:rgba(38,35,34,.18)}
  .hidden{display:none!important}
  .card{background-color:var(--paper);border:3px solid var(--ink);border-radius:20px 26px 18px 24px;box-shadow:6px 6px 0 var(--ink);padding:12px 18px;width:100%;max-width:640px;max-height:100%;overflow:auto;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:7px;transform:rotate(-.6deg)}
  h1{margin:0;font-size:26px;line-height:1.15;font-weight:400;color:#e3f4ee;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);letter-spacing:.5px}
  h1 .a{color:#d5734c}h1 .b{color:#ffc33a}h1 .c{color:#0a98d6}
  h3{margin:2px 0 0;font-size:12px;font-weight:400;opacity:.65}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{font-family:inherit;font-size:14px;padding:7px 12px;border-radius:12px 14px 11px 13px;border:2.5px solid var(--ink);background:#e3f4ee;color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .08s}
  .chip small{display:block;font-size:10px;opacity:.65;margin-top:1px}
  .chip.sel{background:#ffc33a;transform:translate(-1px,-2px) rotate(-1.5deg);box-shadow:4px 5px 0 var(--ink)}
  .chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .go{font-family:inherit;font-size:20px;padding:9px 40px;border:3px solid var(--ink);border-radius:16px 12px 18px 14px;background:#1db578;color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;align-self:center}
  .go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .go.alt{background:#0a98d6}
  .hint{font-size:10.5px;opacity:.7;line-height:1.45}
  .ver{position:absolute;right:14px;bottom:6px;font-size:10px;opacity:.45}
  #quit{position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:5;font-family:inherit;background:var(--paper);border:2px solid var(--ink);color:var(--ink);border-radius:10px;padding:1px 12px;font-size:12px;opacity:.75;box-shadow:2px 2px 0 var(--ink)}
  #rot{display:none;position:fixed;inset:0;z-index:10;background:var(--paper);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
  @media (orientation:portrait){#rot{display:flex}}
  #champ{font-size:26px}
  h1,h2,.otitle,.go,.mbtn span,.badge b,#champ,.lbox,.hand b,.arw{font-family:'Pixelify Sans',monospace!important;font-weight:400!important;letter-spacing:.5px}
  .chip{font-weight:700;line-height:1.15}.chip small{font-weight:600}
  .hint{font-weight:600;font-size:12px}
  .ico{font-weight:700}
  #tab{font-weight:700}
  /* ===== Halaman utama ===== */
  #home{position:fixed;inset:0;overflow:hidden}
  #home button{font-family:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .side{position:absolute;left:2.5vw;top:4vh;display:flex;flex-direction:column;gap:2.5vh}
  .sbtn{position:relative;width:16vh;height:16vh;padding:0;border:0;background:none}
  .sbtn svg,.ico svg,.badge svg,.mbtn .ic svg,.bots svg{width:100%;height:100%;display:block;overflow:visible}
  .sbtn:active,.ico:active,.badge:active,.bots button:active{transform:scale(.92)}
  .dot{position:absolute;right:.5vh;top:.5vh;width:3.2vh;height:3.2vh;border-radius:50%;background:#d5734c;border:2px solid var(--ink)}
  .logo{position:absolute;left:calc(16vh + 5vw);top:3vh;transform:rotate(-2deg);pointer-events:none}
  .logo h1{font-size:5.6vh;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
  .panel{position:absolute;top:-3vh;bottom:-3vh;right:-8vw;width:54vw;transform:skewX(-7deg);transform-origin:bottom left;
    background-color:#f2eee3;background-image:repeating-linear-gradient(45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px),repeating-linear-gradient(-45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px);
    border-left:5px solid var(--ink);box-shadow:-9px 0 0 #ffc33a,-14px 0 0 var(--ink)}
  .inner{transform:skewX(7deg);height:100%;display:flex;flex-direction:column;justify-content:center;gap:2.3vh;padding:5vh 11vw 5vh 6vw;box-sizing:border-box}
  .tops{display:flex;align-items:center;justify-content:center;gap:3.5vw}
  .badge{position:relative;width:19vh;height:19vh;padding:0;border:0;background:none}
  .badge b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:1.5vh;font-weight:400;font-size:6.2vh;color:#e3f4ee;-webkit-text-stroke:1.5px var(--ink);text-shadow:2px 2px 0 var(--ink)}
  .ico{display:flex;flex-direction:column;align-items:center;gap:.5vh;padding:0;border:0;background:none;font-size:3.2vh}
  .ico svg{width:10vh;height:10vh}
  .mbtn{position:relative;display:flex;align-items:center;height:12.5vh;padding:0 0 0 14vh;border:3px solid var(--ink);border-radius:6px;background:#e3f4ee;transform:skewX(-10deg);box-shadow:5px 5px 0 var(--ink);font-size:5vh;letter-spacing:.5px;transition:transform .08s}
  .mbtn:nth-of-type(1){margin-left:0}.mbtn:nth-of-type(2){margin-left:2vh}.mbtn:nth-of-type(3){margin-left:4vh}.mbtn:nth-of-type(4){margin-left:6vh}
  .mbtn span{transform:skewX(10deg);flex:1;text-align:center}
  .mbtn .ic{position:absolute;left:-5vh;top:50%;width:16vh;height:16vh;transform:translateY(-50%) skewX(10deg)}
  .mbtn:active{transform:skewX(-10deg) translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .mbtn.gold{background:#ffc33a}
  .bots{display:flex;justify-content:flex-end;gap:3vw}
  .bots button{width:10vh;height:10vh;padding:0;border:0;background:none}
  /* modal */
  #modal{z-index:10}
  #modal .card{max-width:560px;position:relative}
  #modal h2{margin:0;font-size:22px;font-weight:400}
  .x{position:absolute;right:8px;top:6px;font-family:inherit;border:2px solid var(--ink);background:#e3f4ee;border-radius:10px;width:34px;height:34px;font-size:16px;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
  .big{font-size:22px;padding:14px 22px}
  .list{display:flex;flex-direction:column;gap:6px;font-size:15px;text-align:left}
  .list div{display:flex;align-items:center;gap:10px;background:#e3f4ee;border:2px solid var(--ink);border-radius:12px;padding:6px 10px}
  .ball{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);flex:none}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid4 > div{background:#e3f4ee;border:2.5px solid var(--ink);border-radius:14px;padding:8px 4px;font-size:13px;box-shadow:3px 3px 0 var(--ink)}
  .grid4 .ball{width:44px;height:44px;margin:0 auto 4px}
  .wheelbox{position:relative;width:min(46vh,240px);height:min(46vh,240px);margin:6px auto}
  .wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);box-sizing:border-box;position:relative;transition:transform 3.4s cubic-bezier(.15,.8,.2,1)}
  .wheel span{position:absolute;font-size:15px;color:var(--ink);white-space:nowrap}
  .pin{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);z-index:2}
  .card.blue{background:#e3f4ee;max-width:640px;transform:rotate(-1deg);padding-top:18px;overflow:visible}
  .card.blue .x{background:#d5734c;color:#e3f4ee;border-radius:6px;width:40px;height:40px;font-size:20px;top:-14px;right:-12px;transform:rotate(4deg)}
  .crown{position:absolute;left:50%;top:-34px;width:62px;height:52px;transform:translateX(-50%) rotate(-4deg)}
  .crown svg{width:100%;height:100%;overflow:visible}
  .otitle{font-size:24px!important;color:#e3f4ee;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px}
  .ocols{display:flex;gap:16px;flex-wrap:wrap}
  .ocol{flex:1 1 230px;display:flex;flex-direction:column;gap:10px;justify-content:center}
  .vrow{display:flex;align-items:center;gap:10px}
  .vrow i{width:34px;height:34px;flex:none}
  .vrow i svg{width:100%;height:100%}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:20px;margin:0;border:2.5px solid var(--ink);border-radius:12px;background:linear-gradient(90deg,#1db578 var(--v,50%),#e3f4ee var(--v,50%));box-shadow:2px 3px 0 var(--ink);outline:none;touch-action:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#e3f4ee;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#e3f4ee;border:3px solid var(--ink)}
  .langsel{display:flex;align-items:center;gap:8px}
  .arw{font-family:inherit;border:0;background:none;font-size:24px;color:#18657a;text-shadow:2px 2px 0 var(--ink);padding:0 4px}
  .lbox{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#18657a;color:#e3f4ee;border:2.5px solid var(--ink);padding:8px;transform:skewX(-6deg);box-shadow:3px 3px 0 var(--ink);font-size:15px}
  .lbox span{font-size:22px}
  .olabel{font-size:12px;opacity:.7}
  .hands{display:flex;gap:10px}
  .hand{position:relative;flex:1;background:#e3f4ee;border:2.5px solid var(--ink);border-radius:12px;padding:4px 4px 6px;font-size:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  .hand.on{background:#f2eee3;box-shadow:3px 3px 0 var(--ink),0 0 0 3px #1db578 inset}
  .hand svg{width:100%;height:auto;display:block}
  .hand b{font-weight:400;color:#18657a}
  .hand em{position:absolute;left:6px;top:-12px;font-style:normal;font-size:24px;color:#1db578;text-shadow:1px 1px 0 var(--ink)}
  .orow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
  .orow > span{font-size:13px;min-width:58px;text-align:left}
  .orow .chip{padding:5px 8px;font-size:12.5px;white-space:nowrap}
  .go.small{font-size:14px;padding:6px 18px;background:#1db578}
  .go.alt.small{background:#0a98d6}
  #games{position:fixed;inset:0;z-index:6;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background-color:#f2eee3;
    background-image:repeating-linear-gradient(45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px),repeating-linear-gradient(-45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px)}
  #games *{touch-action:pan-y}
  .gtitle{text-align:center;margin:3.5vh 0 0;font-size:7.5vh!important;color:#e3f4ee;-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
  .back{position:fixed;left:3vw;top:3vh;width:12vh;height:12vh;border:0;background:none;padding:0;z-index:7;cursor:pointer}
  .back svg{width:100%;height:100%;overflow:visible}
  .back:active{transform:scale(.9)}
  .ggrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3.5vh 3vw;max-width:980px;margin:0 auto;padding:3vh 9vw 8vh}
  .gtile{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:1.2vh;cursor:pointer;color:var(--ink)}
  .gtile .pic{display:block;width:100%;aspect-ratio:20/13;border:3px solid var(--ink);border-radius:5px;box-shadow:4px 5px 0 var(--ink);transform:skewX(-3deg) rotate(var(--r));overflow:hidden;transition:transform .1s}
  .gtile img{display:block;width:100%;height:100%}
  .gtile b{font-family:'Pixelify Sans',monospace;font-weight:400;font-size:clamp(13px,4.2vh,21px);letter-spacing:.6px;color:#e3f4ee;-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink);text-transform:uppercase;line-height:1}
  .gtile:active .pic{transform:skewX(-3deg) rotate(var(--r)) scale(.94)}
  #chars{position:fixed;inset:0;z-index:6;display:flex;background-color:#f2eee3;
    background-image:repeating-linear-gradient(45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px),repeating-linear-gradient(-45deg,rgba(38,35,34,.05) 0 2px,transparent 2px 30px)}
  .cl{position:relative;width:32vw;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;background:#f2eee3;border-right:5px solid var(--ink);box-shadow:8px 0 0 #ffc33a,13px 0 0 var(--ink);z-index:1}
  .cl .back{left:2.5vw;top:3vh}
  .avwrap{width:min(50vh,25vw);height:min(50vh,25vw);border-radius:50%;background:#e3f4ee;border:5px solid var(--ink);box-shadow:0 0 0 7px #ffc33a,0 0 0 11px var(--ink);overflow:hidden;margin-top:4vh}
  #avatar{width:100%;height:100%;display:block}
  .pnl{font-size:3vh;font-weight:800;margin-top:2vh}
  #pName{font-family:'Pixelify Sans',monospace;font-size:5vh;text-align:center;width:22vw;border:3px solid var(--ink);background:#e3f4ee;color:var(--ink);transform:skewX(-8deg);box-shadow:4px 4px 0 var(--ink);padding:.4vh 0;outline:none;touch-action:manipulation;-webkit-user-select:text;user-select:text}
  .cr{flex:1;min-width:0;display:flex;flex-direction:column;padding:3vh 3vw 0 5vw}
  .ptabs{display:flex;gap:2.4vw;justify-content:center;align-items:center;position:relative}
  .ptab{width:12vh;height:9.5vh;border:3px solid var(--ink);transform:skewX(-6deg);font-family:'Pixelify Sans',monospace;font-size:4.8vh;color:#e3f4ee;-webkit-text-stroke:1.2px var(--ink);text-shadow:2px 2px 0 var(--ink);box-shadow:3px 4px 0 var(--ink);cursor:pointer;opacity:.6;padding:0}
  .ptab.on{opacity:1;transform:skewX(-6deg) scale(1.13);outline:4px solid #e3f4ee}
  .wallet{position:absolute;right:0;top:50%;transform:translateY(-50%) skewX(-8deg);background:#18657a;color:#e3f4ee;border:3px solid var(--ink);padding:.4vh 1.5vw;font-family:'Pixelify Sans',monospace;font-size:4.2vh;box-shadow:3px 3px 0 var(--ink)}
  .ctabs{display:flex;gap:1.2vw;justify-content:center;margin:3.5vh 0 2.5vh;flex-wrap:nowrap}
  .ctab{display:flex;align-items:center;gap:.4vw;padding:.4vh 1.3vw .4vh .2vw;border:3px solid var(--ink);background:#e3f4ee;transform:skewX(-10deg);font-family:'Pixelify Sans',monospace;font-size:3.4vh;color:#18657a;box-shadow:3px 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
  .ctab i{width:7.5vh;height:7.5vh;margin:-2vh 0 -2vh -1.5vh;transform:skewX(10deg)}
  .ctab i svg{width:100%;height:100%;overflow:visible}
  .ctab.on{background:#ffc33a;color:var(--ink)}
  .items{flex:1;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(15vh,1fr));gap:4vh 2vw;padding:1vh 1.5vw 6vh;align-content:start}
  .items *{touch-action:pan-y}
  .it{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:4px;transform:skewX(-4deg) rotate(var(--r));box-shadow:3px 4px 0 var(--ink);background:#e3f4ee;padding:0;cursor:pointer}
  .it canvas{width:100%;height:100%;display:block}
  .it.sel{outline:4px solid #e3f4ee;box-shadow:3px 4px 0 var(--ink),0 0 0 7px #1db578}
  .it .price{position:absolute;left:-8%;bottom:-16%;background:#18657a;color:#e3f4ee;border:2px solid var(--ink);padding:0 .7vw 0 .4vw;font-family:'Pixelify Sans',monospace;font-size:2.9vh;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
  .it.confirm .price{background:#d5734c}
  .it .ok{position:absolute;right:-14%;bottom:-18%;font-size:5.5vh;color:#1db578;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 #e3f4ee;line-height:1}
  .it.locked canvas{opacity:.75}
  .drawpanel{grid-column:1/-1;display:flex;gap:3vw;align-items:center;background:#e3f4ee;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:2vh 2vw;transform:rotate(-.5deg)}
  .drawpanel canvas{width:26vh;height:26vh;flex:none;border-radius:50%;border:3px dashed var(--ink);background:#f2eee3}
  .drawpanel .dcol{display:flex;flex-direction:column;gap:1.4vh;align-items:flex-start}
  .drawpanel h2{font-size:4.6vh!important;margin:0}
  .tog{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;cursor:pointer}
  .tog input{width:22px;height:22px;accent-color:#1db578}
  #draw{position:fixed;inset:0;z-index:9;display:flex;align-items:center;gap:3vw;padding:3vh 3vw 3vh 4vw;box-sizing:border-box;overflow:hidden;
    background-color:#86aaa2;background-image:repeating-linear-gradient(-35deg,rgba(255,255,255,.16) 0 3px,transparent 3px 24px),radial-gradient(ellipse at 30% 40%,rgba(255,255,255,.3),transparent 65%)}
  .dpaper{position:relative;z-index:1;width:36vw;height:94vh;flex:none;background:#f2eee3;background-image:repeating-linear-gradient(transparent 0 23px,#e3f4ee 23px 25px);border:2px solid #f2eee3;box-shadow:6px 7px 0 rgba(38,35,34,.22);transform:rotate(-.6deg);display:flex;flex-direction:column;gap:1.5vh;padding:2.4vh 2vw;box-sizing:border-box}
  .dpaper::before{content:'';position:absolute;top:-1.6vh;left:38%;width:24%;height:4.2vh;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.08);transform:rotate(-3deg)}
  .dhead{display:flex;align-items:center;gap:.8vw;background:#ffc33a;background-image:repeating-linear-gradient(-60deg,rgba(255,255,255,.28) 0 2px,transparent 2px 7px);padding:.8vh .8vw;margin:0 -1.2vw;border:3px solid var(--ink);transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
  .dhead i{width:8vh;height:8vh;flex:none;background:#e3f4ee;border:2.5px solid var(--ink)}
  .dhead i svg,.dname i svg,.dtoolbtn svg,.dbig svg,.rbtn svg,.dpencils svg{width:100%;height:100%;display:block;overflow:visible}
  .dhead span{flex:1;background:#e3f4ee;border:3px solid var(--ink);font-family:'Pixelify Sans',monospace;font-size:4.8vh;padding:.4vh 1vw;text-align:center;white-space:nowrap}
  .dname{display:flex;align-items:center;gap:1vw}
  .dname i{width:7vh;height:7vh;flex:none}
  .dname input{flex:1;min-width:0;font-family:'Pixelify Sans',monospace;font-size:4.4vh;border:2.5px solid var(--ink);background:#e3f4ee repeating-linear-gradient(transparent 0 9px,#e3f4ee 9px 10px);text-align:center;padding:.3vh;color:var(--ink);outline:none;touch-action:manipulation;-webkit-user-select:text;user-select:text}

function resize(){
  DPR = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  const Wd = Math.round(W*DPR), Hd = Math.round(H*DPR);

  PXC = K/DPR;                                  // ukuran 1 piksel seni dalam px CSS
  AW = Math.floor(Wd/K); AH = Math.floor(Hd/K);

function dFlood(x, y){                          // ember: isi area bersambung yang warnanya sama (termasuk area kosong)

  const col = dCol === 'rainbow' ? RAINBOW[(dHue = (dHue + 8) % 64) >> 3] : dCol, to = hexU(col);

  dctx.putImageData(id, 0, 0);
}

const pads = [0,1,2,3].map(() => ({id:null, ox:0, oy:0, px:0, py:0, t0:0, moved:false, press:0}));

function btnPos(z){

  if(save.dashPos === 'in') return [{x:W/2-m,y:H-m},{x:W/2+m,y:H-m},{x:W/2-m,y:m+58},{x:W/2+m,y:m+58}][z];

}
const solo = () => match && match.hum === 1;
function zoneOf(x, y){
  if(solo()) return 0;                       // 1 pemain: seluruh layar untuk joystick
  const n = match ? match.n : 2;
  if(n === 2) return x < W/2 ? 0 : 1;
  const z = y < H/2 ? (x < W/2 ? 2 : 3) : (x < W/2 ? 0 : 1);

}
const inputOn = () => match && (state === 'count' || state === 'play' || state === 'end');

cv.addEventListener('pointerdown', e => {
  if(!inputOn()) return;
  e.preventDefault();
  const z = zoneOf(e.clientX, e.clientY); if(z < 0 || !players[z]) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const pad = pads[z], b = btnPos(z), o = {z, kind:'joy', x:e.clientX, y:e.clientY};
  if(Math.hypot(e.clientX-b.x, e.clientY-b.y) < BR()*1.3){ o.kind = 'btn'; pad.press = .15; dash(players[z]); }
  else if(pad.id === null) startJoy(pad, e.pointerId, e.clientX, e.clientY);
  else { o.kind = 'extra'; dash(players[z]); }     // jari kedua di area sendiri = dash
  ptrs.set(e.pointerId, o);
});
cv.addEventListener('pointermove', e => {
  const o = ptrs.get(e.pointerId); if(!o) return;
  o.x = e.clientX; o.y = e.clientY;
  if(o.kind !== 'joy') return;
  const pad = pads[o.z];
  pad.px = o.x; pad.py = o.y;
  const dx = pad.px-pad.ox, dy = pad.py-pad.oy, l = Math.hypot(dx,dy);
  if(l > 12) pad.moved = true;
  const lim = JR()*1.4;                      // pangkal joystick ikut jari kalau terlalu jauh
  if(l > lim){ pad.ox = pad.px - dx/l*lim; pad.oy = pad.py - dy/l*lim; }

function release(e){
  const o = ptrs.get(e.pointerId); if(!o) return;
  ptrs.delete(e.pointerId);
  if(o.kind !== 'joy') return;
  const pad = pads[o.z];
  if(e.type === 'pointerup' && !pad.moved && performance.now()-pad.t0 < 220 && players[o.z]) dash(players[o.z]);  // ketuk cepat = dash
  pad.id = null;
  for(const [id,q] of ptrs){                 // jari lain di area yang sama mengambil alih joystick
    if(q.z === o.z && q.kind === 'extra'){ q.kind = 'joy'; startJoy(pad, id, q.x, q.y); pad.moved = true; break; }
  }
}

function readCtrl(p){

  if(pad.id !== null){
    const dx = pad.px-pad.ox, dy = pad.py-pad.oy, l = Math.hypot(dx,dy), dead = 8, R = JR();
    if(l > dead){ const m = Math.min(1, (l-dead)/(R-dead)); p.cx = dx/l*m; p.cy = dy/l*m; }
  } else {
    let x = 0, y = 0;
    KEYMAP.forEach((km, i) => { if(i !== p.i && !(solo() && p.i === 0)) return; const k = km.mv;
      x += (keys[k[1]]?1:0) - (keys[k[0]]?1:0); y += (keys[k[3]]?1:0) - (keys[k[2]]?1:0); });

// ===== BOT =====
// Bot "berpikir" tiap 0.12-0.25 dtk (reaksi manusiawi), lalu menahan arah itu. Strategi berbeda per mini game.
function botCtrl(p, dt){
  p.bt -= dt; if(p.bt > 0) return;
  p.bt = rnd(.12, .25);
  const R = rad(p), others = players.filter(o => o.alive && o !== p);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const near = (list, f) => { let best = null, bd = 1e9; for(const o of list){ const d = f ? f(o) : dist(p, o); if(d < bd){ bd = d; best = o; } } return best; };
  let vx = 0, vy = 0, wantDash = false;
  const to = (x, y, w) => { const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy) || 1; w = w ?? 1; vx += dx/d*w; vy += dy/d*w; return d; };
  const away = (x, y, w) => { const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1; vx += dx/d*w; vy += dy/d*w; };
  const walls = () => { const m = 90; if(p.x < m) vx += (m - p.x)/m*1.5; if(p.x > WW - m) vx -= (p.x - WW + m)/m*1.5; if(p.y < m) vy += (m - p.y)/m*1.5; if(p.y > WH - m) vy -= (p.y - WH + m)/m*1.5; };
  const wander = () => { if(!p.wt || dist(p, p.wt) < 50 || Math.random() < .02) p.wt = {x:rnd(120, WW - 120), y:rnd(100, WH - 100)}; to(p.wt.x, p.wt.y, .8); };
  if(mode === 'eat'){
    const threat = others.filter(o => rad(o) > R*1.1 && dist(p, o) < R + rad(o) + 170);
    const prey = near(others.filter(o => R > rad(o)*1.12 && dist(p, o) < 300));
    if(threat.length){ for(const o of threat) away(o.x, o.y, 1.4); walls(); }
    else if(prey){ const d = to(prey.x + prey.vx*.2, prey.y + prey.vy*.2); wantDash = d < R + rad(prey) + 80 && Math.random() < .5; }
    else { const f = near(food); if(f) to(f.x, f.y); }
  } else if(mode === 'sumo'){
    const dc = Math.hypot(p.x - CX, p.y - CY), o = near(others);
    if(dc > arenaR - R*2.4) to(CX, CY, 1.6);
    if(o){ const d = to(o.x, o.y, .8); const od = Math.hypot(o.x - CX, o.y - CY); wantDash = d < 190 && od > dc*.8 && Math.random() < .45; }
  } else if(mode === 'food'){
    const f = near(food, f => dist(p, f)/(f.v > 1 ? 2.2 : 1)); if(f){ const d = to(f.x, f.y); wantDash = d > 220 && Math.random() < .08; }
  } else if(mode === 'bomb'){
    const h = players[X.h];
    if(h === p){ const o = near(others); if(o){ const d = to(o.x + o.vx*.25, o.y + o.vy*.25, 1.2); wantDash = d < 190 && X.imm <= 0 && Math.random() < .6; } }
    else if(h && h.alive){ const d = dist(p, h); if(d < 340){ away(h.x, h.y, 1.3); walls(); wantDash = d < 130 && Math.random() < .35; } else wander(); }
  } else if(mode === 'soccer'){
    if(X.pause > 0){ p.cx = p.cy = 0; return; }
    const B = X.ball, team = p.i % 2, gx = team === 0 ? WW + 40 : -40, ownX = team === 0 ? 60 : WW - 60;
    const mates = players.filter(o => o.alive && o.i % 2 === team), striker = near(mates, o => dist(o, B)) === p;
    if(striker){
      const ux = gx - B.x, uy = CY - B.y, ul = Math.hypot(ux, uy) || 1, bx = B.x - ux/ul*(R + B.r + 20), by = B.y - uy/ul*(R + B.r + 20);
      const behind = (team === 0 ? p.x < B.x - 10 : p.x > B.x + 10);
      if(!behind || Math.hypot(p.x - bx, p.y - by) > 45){ to(bx, by + (Math.abs(p.y - B.y) < R + B.r && !behind ? (p.y < B.y ? -60 : 60) : 0), 1); }
      else { const d = to(B.x, B.y, 1); wantDash = d < R + B.r + 60 && Math.random() < .5; }
    } else { to(ownX + (team === 0 ? 220 : -220), clamp(B.y, CY - 120, CY + 120), .9); }
  } else if(mode === 'crown'){
    p.agg = p.agg ?? rnd(.25, 1);                                   // kepribadian: berani rebut vs sabar menunggu
    if(!p.crT || elapsed > p.crT){ p.crT = elapsed + rnd(1.5, 3); p.crWait = Math.random() > p.agg; }
    const z = X.next && X.mt < 1.6 ? X.next : X.z, dz = Math.hypot(p.x - z.x, p.y - z.y);
    const inside = others.filter(o => Math.hypot(o.x - z.x, o.y - z.y) < z.r + 20), rival = near(inside);
    if(inside.length >= 1 && p.crWait){ const a = Math.atan2(p.y - z.y, p.x - z.x); to(z.x + Math.cos(a)*(z.r + 70), z.y + Math.sin(a)*(z.r + 70), .9); }
    else if(rival){ const d = to(rival.x, rival.y, 1);
      if(d < 200 && canDash(p) && Math.random() < .3 + .4*p.agg){ const l = d || 1; p.cx = (rival.x - p.x)/l; p.cy = (rival.y - p.y)/l; dash(p); } }
    else { const d = to(z.x, z.y, 1); if(d < z.r*.4){ vx *= .3; vy *= .3; } }
  } else if(mode === 'snow'){
    const o = near(others);
    if(o){
      const d = dist(p, o); if(d > 330) to(o.x, o.y, .9); else if(d < 210) away(o.x, o.y, .9);
      p.strafe = p.strafe || (Math.random() < .5 ? 1 : -1); if(Math.random() < .05) p.strafe *= -1;
      const ux = (o.x - p.x)/(d || 1), uy = (o.y - p.y)/(d || 1); vx += -uy*p.strafe*.7; vy += ux*p.strafe*.7;
      for(const b of X.balls){ if(b.o === p.i) continue; const rx = p.x - b.x, ry = p.y - b.y, bl = Math.hypot(b.vx, b.vy) || 1;
        if(Math.hypot(rx, ry) < 200 && (rx*b.vx + ry*b.vy)/bl > 0){ vx += -b.vy/bl*1.6; vy += b.vx/bl*1.6; } }
      walls();
      if(canDash(p) && d < 520 && Math.random() < .55){                // bidik posisi lawan berikutnya lalu lempar
        const tx = o.x + o.vx*d/720, ty = o.y + o.vy*d/720, tl = Math.hypot(tx - p.x, ty - p.y) || 1;

      }
    }
  } else if(mode === 'meteor'){
    let danger = false;
    for(const m of X.mets){ const d = Math.hypot(p.x - m.x, p.y - m.y); if(d < m.r + R + 50){ away(m.x, m.y, 2.2*(1.2 - m.t/m.max)); danger = true; wantDash = wantDash || (m.t < .45 && d < m.r + R && Math.random() < .7); } }

    if(!p.pt || Math.random() < .08 || X.grid[p.pt.k] === p.i){
      let best = null, bd = 1e9;
      for(let k=0;k<14;k++){ const c = Math.floor(rnd(0, X.cols)), r = Math.floor(rnd(0, X.rows)), kk = r*X.cols + c; if(X.grid[kk] === p.i) continue;
        const x = (c + .5)*X.cell, y = (r + .5)*X.cell, d = Math.hypot(x - p.x, y - p.y)*(X.grid[kk] >= 0 ? .8 : 1); if(d < bd){ bd = d; best = {x, y, k:kk}; } }

    }

  } else wander();

  if(l > .05){ const k = Math.min(1, l)*.92/l; p.cx = vx*k; p.cy = vy*k; } else { p.cx = p.cy = 0; }
  if(wantDash && canDash(p)) dash(p);
}
const canDash = p => p.alive && p.dashCd <= 0 && !(mode === 'eat' && p.m < 400);
function dash(p){
  if(state !== 'play' || !canDash(p)) return;
  if(mode === 'eat') p.m *= .94;
  let dx = p.fx, dy = p.fy;
  const cl = Math.hypot(p.cx,p.cy);
  if(cl > .2){ dx = p.cx/cl; dy = p.cy/cl; }
  if(mode === 'snow'){                       // lempar bola salju
    const r0 = rad(p);
    X.balls.push({x:p.x + dx*(r0+14), y:p.y + dy*(r0+14), vx:dx*720 + p.vx*.3, vy:dy*720 + p.vy*.3, o:p.i, life:1.1});
    p.vx -= dx*90; p.vy -= dy*90; p.fx = dx; p.fy = dy;
    p.dashMax = p.dashCd = .55; p.dashFx = .2; sfx('pop'); buzz(10); playShot(p, 'dash');
    return;
  }
  const imp = mode === 'sumo' ? 560 : mode === 'eat' ? 520 : 600;
  p.vx += dx*imp; p.vy += dy*imp; p.fx = dx; p.fy = dy;
  if(mode === 'soccer'){ const B = X.ball; if(Math.hypot(B.x-p.x, B.y-p.y) < rad(p) + B.r + 40){ B.vx += dx*780; B.vy += dy*780; sfx('bonk'); burst(B.x, B.y, '#e3f4ee', 6, 180); } }
  if(mode === 'paint') burst(p.x, p.y, CHARS[p.i].c, 10, 220);
  p.dashMax = p.dashCd = mode === 'sumo' ? 1.1 : .8; p.dashFx = .3; sfx('dash'); playShot(p, 'dash');
  const r = rad(p);
  for(let k=0;k<6;k++) parts.push({type:'line', x:p.x - dx*r*rnd(1,1.6) + rnd(-r,r)*-dy, y:p.y - dy*r*rnd(1,1.6) + rnd(-r,r)*dx, dx, dy, len:rnd(20,45), life:.3, max:.3});
  buzz(15);
}
function buzz(ms){ if(!save.vib) return; try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function burst(x, y, col, n, spd){

    parts.push({type:'spark', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rnd(.35,.7), max:.7, col, sz:rnd(5,10), rot:rnd(0,6)}); }
}
function popText(x, y, txt, col, sz){ parts.push({type:'text', x, y, vx:0, vy:-70, life:.9, max:.9, txt, col, sz}); }
function updateParts(dt){
  for(const q of parts){ q.life -= dt; if(q.vx !== undefined){ q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .92; q.vy *= .92; } }
  parts = parts.filter(q => q.life > 0);
  if(parts.length > 300) parts.splice(0, parts.length-300);
}

// ---------- Update ----------
const rad = p => Math.sqrt(p.m);
function params(p){
  if(mode === 'eat') return {ms: 280*Math.pow(rad(p)/30, -0.35), k:6};
  if(mode === 'sumo') return {ms:260, k:3.4};
  if(mode === 'bomb') return {ms: p.i === X.h ? 330 : 295, k:5};
  if(mode === 'snow' || mode === 'meteor') return {ms:290, k:6};
  if(mode === 'crown') return {ms:280, k:4.5};
  return {ms:300, k:5};
}

// ===== ANIMASI FRAME (durasi dalam milidetik, tiap frame boleh beda) =====
// [ms, tambahan lebar, tambahan tinggi] dalam piksel seni. Squash/stretch cukup 1-2 px dan hanya untuk benda bergerak.
const ANIM = {
  idle: [[520, 0, 0], [260, 1, -1]],                       // napas pelan, frame "buang napas" lebih singkat
  move: [[110, -1, 1], [90, 0, 0], [110, 1, -1], [90, 0, 0]], // lompat kecil saat berjalan
  dash: [[60, 1, -1], [90, -1, 2], [80, -1, 1], [70, 1, -1]], // antisipasi -> regang -> mantul
  bonk: [[80, 2, -2], [90, 1, -1], [70, -1, 1]],            // benturan: frame tekan ditahan paling lama
};
function animStep(p, dt){
  const ms = dt*1000;
  if(p.shot){ p.shotT += ms; let t = p.shotT, f = null;
    for(const fr of ANIM[p.shot]){ if(t < fr[0]){ f = fr; break; } t -= fr[0]; }
    if(f){ p.sq = [f[1], f[2]]; return; } p.shot = null; }
  const seq = p.alive && Math.hypot(p.vx, p.vy) > 80 ? ANIM.move : ANIM.idle;
  if(p.seq !== seq){ p.seq = seq; p.animT = 0; }
  const tot = seq.reduce((a, f) => a + f[0], 0);
  p.animT = ((p.animT || p.i*170) + ms) % tot;
  let t = p.animT; for(const f of seq){ if(t < f[0]){ p.sq = [f[1], f[2]]; return; } t -= f[0]; }
}
const playShot = (p, k) => { if(p && (!p.shot || k === 'bonk')){ p.shot = k; p.shotT = 0; } };

function update(dt){
  T += dt;
  for(const p of players) animStep(p, dt);
  shake *= Math.exp(-10*dt);
  updateParts(dt);
  for(const p of pads) p.press = Math.max(0, p.press-dt);
  for(const p of players){
    p.blink -= dt; if(p.blink < -.12) p.blink = rnd(2,4.5);
    if(!p.alive){ p.fall = Math.max(0, p.fall-dt); p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= Math.exp(-2*dt); p.vy *= Math.exp(-2*dt); }
    p.expr = !p.alive ? 'dead' : p.won ? 'happy' : p.dashFx > 0 ? 'dash' : p.scared ? 'scared' : p.blink < 0 ? 'blink' : 'normal';
  }
  if(state === 'count'){
    tCount -= dt; const c = Math.ceil(tCount);
    if(c !== tickPrev){ tickPrev = c; if(c >= 1 && c <= 3) sfx('tick'); }
    if(tCount <= 0){ state = 'play'; sfx('go'); }
    return;
  }
  if(state === 'end'){
    tEnd -= dt;
    if(tEnd <= 0){ match.idx++; if(match.idx >= match.order.length) finishMatch(); else startRound(); }
    return;
  }
  if(state !== 'play') return;
  elapsed += dt; if(MODES[mode].time) tLeft -= dt;

  for(const p of players){
    if(!p.alive) continue;
    if(p.bot) botCtrl(p, dt); else readCtrl(p);
    const cl = Math.hypot(p.cx,p.cy);
    if(cl > .2){ p.fx = p.cx/cl; p.fy = p.cy/cl; }
    const {ms,k} = params(p);
    p.vx += p.cx*ms*k*dt; p.vy += p.cy*ms*k*dt;
    const f = Math.exp(-k*dt); p.vx *= f; p.vy *= f;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.dashCd = Math.max(0, p.dashCd-dt); p.dashFx = Math.max(0, p.dashFx-dt);
    p.scared = false;
    const fxk = CHARS[p.i].fx;
    if(fxk !== 'none'){ p.fxT = (p.fxT || 0) - dt; if(Math.hypot(p.vx,p.vy) > 70 && p.fxT <= 0){ p.fxT = .07; trail(p, fxk); } }
  }

  if(mode === 'sumo'){
    if(elapsed > 3) arenaR = Math.max(60, 300 - (elapsed-3)*3.6);
    collide(.9);
    for(const p of players){
      if(!p.alive) continue;
      const d = Math.hypot(p.x-CX, p.y-CY), r = rad(p);
      if(d > arenaR - r*.8) p.scared = true;
      if(d > arenaR + r*.3){
        p.alive = false; p.fall = p.fallMax = .6; shake = 12; buzz(60); sfx('out');
        popText(p.x, p.y - r, 'OUT!', CHARS[p.i].d, 34); burst(p.x, p.y, CHARS[p.i].c, 14, 260);
      }
    }
  } else {
    for(const p of players){
      if(!p.alive) continue;
      const r = rad(p);
      if(p.x < r){ p.x = r; p.vx = Math.abs(p.vx)*.3; } if(p.x > WW-r){ p.x = WW-r; p.vx = -Math.abs(p.vx)*.3; }
      if(p.y < r){ p.y = r; p.vy = Math.abs(p.vy)*.3; } if(p.y > WH-r){ p.y = WH-r; p.vy = -Math.abs(p.vy)*.3; }
    }
    if(mode !== 'eat') collide(.7);
    updateExtra(dt);
    for(const p of players){
      if(!p.alive) continue;
      const r = rad(p);
      for(let i=0;i<food.length;i++){
        const f = food[i], fr = mode === 'food' ? (f.v > 1 ? 20 : 16) : 15;
        if(Math.hypot(f.x-p.x, f.y-p.y) < r + fr*.6){
          if(mode === 'eat'){ p.m += 16; sfx('blip'); if(Math.random() < .3) burst(f.x, f.y, f.col, 3, 90); }
          else { p.score += f.v; sfx(f.v > 1 ? 'star' : 'pop'); burst(f.x, f.y, f.v > 1 ? '#ffc33a' : '#e3f4ee', f.v > 1 ? 12 : 6, 200); popText(f.x, f.y-14, '+' + f.v, f.v > 1 ? '#c5763b' : CHARS[p.i].d, f.v > 1 ? 26 : 20); }
          food[i] = newFood();
        }
      }
      if(mode === 'eat' && p.m > 3000) p.m -= p.m*.005*dt;
    }
    if(mode === 'eat'){
      for(const a of players) for(const b of players){
        if(a === b || !a.alive || !b.alive) continue;
        const ra = rad(a), rb = rad(b), d = Math.hypot(a.x-b.x, a.y-b.y);
        if(ra > rb*1.1){
          if(d < ra + rb + 120) b.scared = true;
          if(d < ra - rb*.35){
            a.m += b.m*.85; b.alive = false; b.fall = b.fallMax = .35;
            b.vx = (a.x-b.x)*3; b.vy = (a.y-b.y)*3;
            shake = 10; buzz(60); sfx('chomp');
            popText(a.x, a.y - ra, 'NYAM!', CHARS[a.i].d, 30); burst(b.x, b.y, CHARS[b.i].c, 14, 240);
          }
        }
      }
    }
  }
  checkRoundEnd();
}

function collide(rest){
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    const a = players[i], b = players[j];
    if(!a.alive || !b.alive) continue;
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || .001, min = rad(a)+rad(b);
    if(d < min){
      const nx = dx/d, ny = dy/d, ov = (min-d)/2;
      a.x -= nx*ov; a.y -= ny*ov; b.x += nx*ov; b.y += ny*ov;
      const rel = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
      if(rel > 0){
        const imp = (1+rest)*rel/2;
        a.vx -= imp*nx; a.vy -= imp*ny; b.vx += imp*nx; b.vy += imp*ny;
        if(rel > 260){
          const hx = a.x + nx*rad(a), hy = a.y + ny*rad(a);
          burst(hx, hy, '#e3f4ee', 8, 220); shake = Math.max(shake, 6); buzz(25); sfx('bonk'); playShot(a, 'bonk'); playShot(b, 'bonk');
          if(rel > 420) popText(hx, hy - 20, Math.random() < .5 ? 'BONK!' : 'DUAK!', '#b8300e', 26);
        }
      }
    }
  }
}

function checkRoundEnd(){
  const alive = players.filter(p => p.alive);
  let winners = null;
  if(mode === 'sumo'){ if(alive.length <= 1) winners = alive; }
  else if(mode === 'eat'){
    if(alive.length <= 1) winners = alive;
    else if(tLeft <= 0){ const mx = Math.max(...alive.map(p => p.m)); winners = alive.filter(p => p.m === mx); }
  } else if(mode === 'bomb' || mode === 'meteor'){ if(alive.length <= 1) winners = alive; }
  else if(mode === 'snow'){
    if(alive.length <= 1) winners = alive;
    else if(tLeft <= 0){ const mx = Math.max(...alive.map(p => p.hp)); winners = alive.filter(p => p.hp === mx); }
  } else if(mode === 'soccer'){
    const g = X.goals;
    if(g[0] >= 3 || g[1] >= 3 || tLeft <= 0) winners = g[0] === g[1] ? [] : players.filter(p => p.i % 2 === (g[0] > g[1] ? 0 : 1));
  } else if(tLeft <= 0){
    const mx = Math.max(...players.map(p => p.score)); winners = mx > 0 ? players.filter(p => p.score === mx) : [];
  }
  if(!winners) return;
  for(const w of winners){ match.wins[w.i]++; save.wins[w.i]++; save.stars++; w.won = true; burst(w.x, w.y, '#ffc33a', 18, 300); }
  endText = winners.length === 0 ? t('draw') : (winners.length === 1 || mode === 'soccer') ? winners.map(w => CHARS[w.i].n).join(' & ') + t('win') : t('drawW') + winners.map(w => CHARS[w.i].n).join(' & ');
  endCol = winners.length === 1 ? CHARS[winners[0].i].c : '#e3f4ee';
  state = 'end'; tEnd = 2.8; sfx('win');
}

function finishMatch(){
  state = 'over';
  const mx = Math.max(...match.wins);
  const champs = match.wins.map((w,i) => w === mx ? i : -1).filter(i => i >= 0);
  for(const p of players) p.won = champs.includes(p.i) && mx > 0;
  sfx('fanfare'); save.matches++; if(mx > 0 && champs.length === 1) save.trophies[champs[0]]++; persist();
  $('champ').textContent = mx === 0 ? t('allDraw') : champs.length === 1 ? '🏆 ' + CHARS[champs[0]].n + t('champ') : '🤝 ' + t('drawW') + champs.map(i => CHARS[i].n).join(' & ');
  $('tab').innerHTML = match.wins.map((w,i) => `<span style="color:${CHARS[i].d}">${CHARS[i].n}</span>: ${'★'.repeat(w) || '–'}`).join('<br>');
  $('end').classList.remove('hidden'); $('quit').classList.add('hidden');
  resetInput();
}

// ---------- Mini game tambahan ----------
let X = {};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function initExtra(){
  X = {};
  const alive = players.filter(p => p.alive);
  if(mode === 'bomb'){ X.h = alive[Math.floor(Math.random()*alive.length)].i; X.fuse = rnd(8,11); X.imm = 0; X.tick = 0; }
  if(mode === 'soccer'){ X.ball = {x:CX, y:CY, vx:0, vy:0, r:22, rot:0}; X.goals = [0,0]; X.pause = 0; X.spawn = players.map(p => ({x:p.x, y:p.y})); }
  if(mode === 'crown'){ X.z = {x:CX, y:CY, r:115}; X.next = null; X.mt = 9; X.owner = -1; }
  if(mode === 'snow'){ X.balls = []; X.forts = [{cx:CX-230,cy:CY,hw:22,hh:75},{cx:CX+230,cy:CY,hw:22,hh:75},{cx:CX,cy:CY-175,hw:80,hh:22},{cx:CX,cy:CY+175,hw:80,hh:22}]; }
  if(mode === 'meteor'){ X.mets = []; X.craters = []; X.spawn = 1.2; }
  if(mode === 'paint'){ X.cell = 50; X.cols = Math.ceil(WW/50); X.rows = Math.ceil(WH/50); X.grid = new Int8Array(X.cols*X.rows).fill(-1); X.total = X.cols*X.rows; X.counts = [0,0,0,0]; }
}
function pushOutRect(p, r, f){
  const nx = clamp(p.x, f.cx-f.hw, f.cx+f.hw), ny = clamp(p.y, f.cy-f.hh, f.cy+f.hh);
  const dx = p.x-nx, dy = p.y-ny, d = Math.hypot(dx,dy);
  if(d >= r) return;
  if(d < .001){ p.y = f.cy - f.hh - r; return; }
  p.x = nx + dx/d*r; p.y = ny + dy/d*r;
  const vn = p.vx*dx/d + p.vy*dy/d; if(vn < 0){ p.vx -= vn*dx/d; p.vy -= vn*dy/d; }
}
function knockOut(p, txt){
  p.alive = false; p.fall = p.fallMax = .5; shake = Math.max(shake, 12); buzz(80); sfx('out');
  popText(p.x, p.y - rad(p), txt || 'OUT!', CHARS[p.i].d, 30); burst(p.x, p.y, CHARS[p.i].c, 14, 260);
}
function updateExtra(dt){
  if(mode === 'bomb'){
    X.imm = Math.max(0, X.imm - dt); X.fuse -= dt;
    const h = players[X.h];
    if(h && h.alive && X.imm <= 0) for(const o of players){
      if(o === h || !o.alive) continue;
      if(Math.hypot(o.x-h.x, o.y-h.y) < rad(o) + rad(h) + 6){ X.h = o.i; X.imm = .6; sfx('pop'); buzz(30); popText(o.x, o.y - rad(o) - 30, '💣!', CHARS[o.i].d, 24); break; }
    }
    for(const p of players) p.scared = p.alive && p.i === X.h;
    const c = Math.ceil(X.fuse); if(X.fuse < 3 && c !== X.tick){ X.tick = c; sfx('tick'); }
    if(X.fuse <= 0){
      const v = players[X.h];
      burst(v.x, v.y, '#d5734c', 20, 380); burst(v.x, v.y, '#ffc33a', 14, 300); sfx('boom'); shake = 18;
      knockOut(v, 'DUAR!');
      for(const o of players){ if(!o.alive) continue; const dx = o.x-v.x, dy = o.y-v.y, d = Math.hypot(dx,dy) || 1; if(d < 200){ o.vx += dx/d*500; o.vy += dy/d*500; } }
      const al = players.filter(p => p.alive);
      if(al.length > 1){ X.h = al[Math.floor(Math.random()*al.length)].i; X.fuse = rnd(7,10); X.imm = 1; X.tick = 0; }
    }
  }
  if(mode === 'soccer'){
    const B = X.ball;
    if(X.pause > 0){
      X.pause -= dt;
      if(X.pause <= 0){ Object.assign(B, {x:CX, y:CY, vx:0, vy:0}); players.forEach((p,i) => { p.x = X.spawn[i].x; p.y = X.spawn[i].y; p.vx = p.vy = 0; }); }
      return;
    }
    B.x += B.vx*dt; B.y += B.vy*dt; const fr = Math.exp(-1.1*dt); B.vx *= fr; B.vy *= fr; B.rot += Math.hypot(B.vx,B.vy)*dt/B.r;
    const inGoal = Math.abs(B.y - CY) < 105;
    if(B.y < B.r){ B.y = B.r; B.vy = Math.abs(B.vy)*.8; } if(B.y > WH-B.r){ B.y = WH-B.r; B.vy = -Math.abs(B.vy)*.8; }
    const goal = team => {
      X.goals[team]++; X.pause = 1.8; shake = 12; sfx('win'); buzz(100);
      popText(clamp(B.x, 120, WW-120), B.y, t('goal'), CHARS[team].d, 40); burst(B.x, B.y, CHARS[team].c, 24, 360);
    };
    if(B.x < B.r){ if(inGoal) return goal(1); B.x = B.r; B.vx = Math.abs(B.vx)*.8; }
    if(B.x > WW-B.r){ if(inGoal) return goal(0); B.x = WW-B.r; B.vx = -Math.abs(B.vx)*.8; }
    for(const p of players){
      if(!p.alive) continue;
      const dx = B.x-p.x, dy = B.y-p.y, d = Math.hypot(dx,dy) || .001, min = rad(p) + B.r;
      if(d < min){
        const nx = dx/d, ny = dy/d; B.x = p.x + nx*min; B.y = p.y + ny*min;
        const rel = (p.vx-B.vx)*nx + (p.vy-B.vy)*ny;
        if(rel > 0){ B.vx += nx*rel*1.6; B.vy += ny*rel*1.6; if(rel > 300) sfx('thud'); }
      }
    }
  }
  if(mode === 'crown'){
    X.mt -= dt;
    if(X.mt < 2.2 && !X.next) X.next = {x:rnd(170,WW-170), y:rnd(150,WH-150)};
    if(X.mt <= 0){ X.z.x = X.next.x; X.z.y = X.next.y; X.next = null; X.mt = 9; sfx('pop'); }
    const ins = players.filter(p => p.alive && Math.hypot(p.x-X.z.x, p.y-X.z.y) < X.z.r);
    X.owner = ins.length === 1 ? ins[0].i : ins.length > 1 ? -2 : -1;
    if(ins.length === 1){ ins[0].score += dt; if(Math.random() < dt*5) burst(ins[0].x, ins[0].y - rad(ins[0]), '#ffc33a', 1, 90); }
  }
  if(mode === 'snow'){
    for(const p of players) if(p.alive) for(const f of X.forts) pushOutRect(p, rad(p), f);
    for(const b of X.balls){
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      if(b.x < 0 || b.x > WW || b.y < 0 || b.y > WH){ b.life = 0; continue; }
      for(const f of X.forts) if(Math.abs(b.x-f.cx) < f.hw+8 && Math.abs(b.y-f.cy) < f.hh+8){ b.life = 0; burst(b.x, b.y, '#e3f4ee', 6, 140); sfx('thud'); }
      if(b.life <= 0) continue;
      for(const p of players){
        if(!p.alive || p.i === b.o || Math.hypot(p.x-b.x, p.y-b.y) > rad(p) + 10) continue;
        b.life = 0; p.hp--; p.vx += b.vx*.45; p.vy += b.vy*.45;
        burst(b.x, b.y, '#e3f4ee', 12, 240); sfx('bonk'); buzz(40); shake = Math.max(shake, 6);
        if(p.hp <= 0) knockOut(p); else popText(p.x, p.y - rad(p) - 20, '❄ -1', '#18657a', 20);
        break;
      }
    }
    X.balls = X.balls.filter(b => b.life > 0);
  }
  if(mode === 'meteor'){
    X.spawn -= dt;
    if(X.spawn <= 0){
      const al = players.filter(p => p.alive), n = elapsed > 20 ? 2 : 1;
      for(let k=0;k<n;k++){
        let x, y;
        if(Math.random() < .55 && al.length){ const p = al[Math.floor(Math.random()*al.length)]; x = p.x + rnd(-90,90) + p.vx*.5; y = p.y + rnd(-90,90) + p.vy*.5; }
        else { x = rnd(40,WW-40); y = rnd(40,WH-40); }
        X.mets.push({x:clamp(x,30,WW-30), y:clamp(y,30,WH-30), t:1.25, max:1.25, r:rnd(50,68)});
      }
      X.spawn = Math.max(.3, 1.05 - elapsed*.018) * rnd(.75,1.2);
    }
    for(const p of players) p.scared = false;
    for(const m of X.mets){
      m.t -= dt;
      for(const p of players) if(p.alive && Math.hypot(p.x-m.x, p.y-m.y) < m.r + rad(p)) p.scared = true;
      if(m.t <= 0){
        burst(m.x, m.y, '#fcb67a', 14, 300); burst(m.x, m.y, '#c5763b', 8, 200); sfx('thud'); shake = Math.max(shake, 7);
        X.craters.push({x:m.x, y:m.y, r:m.r*.8, life:5});
        for(const p of players) if(p.alive && Math.hypot(p.x-m.x, p.y-m.y) < m.r + rad(p)*.35) knockOut(p);
      }
    }
    X.mets = X.mets.filter(m => m.t > 0);
    for(const c of X.craters) c.life -= dt;
    X.craters = X.craters.filter(c => c.life > 0);
  }
  if(mode === 'paint'){
    const cs = X.cell;
    for(const p of players){
      if(!p.alive) continue;
      const rr = rad(p) * (p.dashFx > 0 ? 1.9 : 1.05);
      const c0 = Math.max(0, Math.floor((p.x-rr)/cs)), c1 = Math.min(X.cols-1, Math.floor((p.x+rr)/cs));
      const r0 = Math.max(0, Math.floor((p.y-rr)/cs)), r1 = Math.min(X.rows-1, Math.floor((p.y+rr)/cs));
      for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
        if(Math.hypot((c+.5)*cs - p.x, (r+.5)*cs - p.y) > rr) continue;
        const k = r*X.cols + c, prev = X.grid[k];
        if(prev !== p.i){ if(prev >= 0) X.counts[prev]--; X.grid[k] = p.i; X.counts[p.i]++; }
      }
    }
    for(const p of players) p.score = X.counts[p.i];
  }
}
function liveText(p){
  switch(mode){
    case 'eat': return Math.floor(p.m/10);
    case 'food': return p.score + ' ' + t('pts');
    case 'bomb': return !p.alive ? t('fell') : p.i === X.h ? '💣 ' + Math.max(0, Math.ceil(X.fuse)) : t('safe');
    case 'soccer': return '⚽ ' + X.goals[p.i % 2];
    case 'crown': return '👑 ' + Math.floor(p.score) + 's';
    case 'snow': return p.alive ? '❤'.repeat(p.hp) : t('fell');
    case 'paint': return Math.round(p.score/X.total*100) + '%';
    default: return p.alive ? t('safe') : t('fell');
  }
}

// ---------- Gambar karakter ----------
function wobbly(x, y, r, seed, amp){
  if(!amp){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); return; }
  const TB = Math.floor(T*8)/8;   // garis 'bergetar' seperti animasi gambar tangan
  ctx.beginPath();
  const N = 30;
  for(let i=0;i<=N;i++){
    const a = i/N*6.2832, w = 1 + 0*amp*(Math.sin(a*3+seed+TB*7.3)*.6 + Math.sin(a*5-seed*1.7+TB*11.1)*.4);
    const px = x + Math.cos(a)*r*w, py = y + Math.sin(a)*r*w;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath();
}
let AUTOOL = false;
function inkStroke(w){
  if(AUTOOL){ if(ctx.__f) return; ctx.lineWidth = PXW*1.3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); return; }
  ctx.lineWidth = PXW*2; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }

function accessoryBack(ch, r){
  const lw = Math.max(2, r*.06);
  if(ch.acc === 'ears'){
    for(const s of [-1,1]){
      const a1 = -Math.PI/2 + s*.3, a2 = -Math.PI/2 + s*1.0, at = -Math.PI/2 + s*.62;
      const P = a => [Math.cos(a)*r*.85, Math.sin(a)*r*.85];
      const p1 = P(a1), p2 = P(a2), tip = [Math.cos(at)*r*1.5, Math.sin(at)*r*1.5];
      ctx.beginPath(); ctx.moveTo(...p1); ctx.lineTo(...tip); ctx.lineTo(...p2); ctx.closePath();
      ctx.fillStyle = ch.c; ctx.fill(); inkStroke(lw);
      const cx = (p1[0]+p2[0]+tip[0])/3, cy = (p1[1]+p2[1]+tip[1])/3, k = .5;
      ctx.beginPath(); [p1,tip,p2].forEach((q,i) => { const x = cx+(q[0]-cx)*k, y = cy+(q[1]-cy)*k + r*.05; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
      ctx.closePath(); ctx.fillStyle = '#ffadaf'; ctx.fill();
    }
  } else if(ch.acc === 'ahoge'){
    ctx.beginPath(); ctx.moveTo(-r*.08, -r*.9);
    ctx.quadraticCurveTo(-r*.2, -r*1.55, r*.38, -r*1.5);
    ctx.quadraticCurveTo(r*.02, -r*1.38, r*.1, -r*.9);
    ctx.closePath(); ctx.fillStyle = ch.c; ctx.fill(); inkStroke(lw);
  } else if(ch.acc === 'leaf'){
    ctx.beginPath(); ctx.moveTo(0, -r*.9); ctx.quadraticCurveTo(-r*.05, -r*1.15, r*.02, -r*1.3); inkStroke(lw);
    ctx.save(); ctx.translate(r*.22, -r*1.35); ctx.rotate(-.5);
    ctx.beginPath(); ctx.ellipse(0, 0, r*.26, r*.12, 0, 0, 7); ctx.fillStyle = '#5ab230'; ctx.fill(); inkStroke(lw*.8);
    ctx.beginPath(); ctx.moveTo(-r*.2, 0); ctx.lineTo(r*.18, 0); inkStroke(lw*.5);
    ctx.restore();
  }
}
function accessoryFront(ch, r){

}

function drawFace(p, r, ch){
  const frog = ch.sp === 'frog' && !ch.skin;
  const gx = p.fx*r*.16, gy = p.fy*r*.12, ex = frog ? r*.44 : r*.3, ey = frog ? -r*.66 : -r*.1, lw = Math.max(2, r*.065);

  for(const s of [-1,1]){
    const cx = gx + s*ex, cy = gy + ey, ew = r*.19, eh = r*.25;
    ctx.beginPath();
    if(e === 'dead'){
      ctx.moveTo(cx-ew*.8, cy-ew*.8); ctx.lineTo(cx+ew*.8, cy+ew*.8); ctx.moveTo(cx+ew*.8, cy-ew*.8); ctx.lineTo(cx-ew*.8, cy+ew*.8); inkStroke(lw);
    } else if(e === 'happy'){

    } else if(e === 'dash'){

    } else if(e === 'blink'){
      ctx.moveTo(cx-ew, cy+eh*.1); ctx.quadraticCurveTo(cx, cy+eh*.5, cx+ew, cy+eh*.1); inkStroke(lw);
    } else {

        ctx.beginPath(); ctx.arc(cx + p.fx*ew*.3, cy + p.fy*eh*.3, ew*.35, 0, 7); ctx.fillStyle = INK; ctx.fill();
      } else {
        ctx.ellipse(cx + p.fx*ew*.2, cy + p.fy*eh*.15, ew*.78, eh*.92, 0, 0, 7); ctx.fillStyle = INK; ctx.fill();
        const hs = Math.max(PXW*1.5, ew*.42);
        ctx.fillStyle = '#e3f4ee'; ctx.fillRect(cx + p.fx*ew*.2 - ew*.45, cy + p.fy*eh*.15 - eh*.6, hs, hs);
      }
    }
  }
  const my = gy + r*.25;
  ctx.beginPath();
  if(frog && e !== 'dead' && e !== 'dash' && e !== 'scared'){ ctx.moveTo(gx - r*.5, my - r*.06); ctx.quadraticCurveTo(gx, my + (e === 'happy' ? r*.28 : r*.14), gx + r*.5, my - r*.06); inkStroke(lw); }
  else if(e === 'happy'){

  } else if(e === 'dash' || e === 'scared'){

    ctx.moveTo(gx - r*.12, my); for(let i=1;i<=4;i++) ctx.lineTo(gx - r*.12 + i*r*.06, my + (i%2 ? -r*.04 : 0)); inkStroke(lw*.8);
  } else {
    ctx.moveTo(gx - r*.08, my - r*.01); ctx.quadraticCurveTo(gx, my + r*.06, gx + r*.08, my - r*.01); inkStroke(lw*.8);
  }
  if(e === 'scared'){
    const sx = r*.7, sy = -r*.5;
    ctx.beginPath(); ctx.moveTo(sx, sy - r*.2); ctx.quadraticCurveTo(sx + r*.13, sy, sx, sy + r*.06); ctx.quadraticCurveTo(sx - r*.13, sy, sx, sy - r*.2);
    ctx.fillStyle = '#e3f4ee'; ctx.fill(); inkStroke(lw*.6);
  }
}

function charShadow(p){

  ctx.beginPath(); ctx.ellipse(p.x + r*.1, p.y + r*.92, r*.78, r*.2, 0, 0, 7); softFill('#110a02', .22);
}
function drawChar(p, spr){

function ellPts(cx, cy, rx, ry, rot, n){ n = n || 32; const c = Math.cos(rot || 0), s = Math.sin(rot || 0), out = [];

// ---------- Kepala hewan ----------
// tiap spesies punya siluet sendiri: superellipse [rx, ry, n] + modifikasi bentuk
const HEAD = {
  cat:  {rx:1.08, ry:.9,  n:3.2},
  fox:  {rx:1.1,  ry:.95, n:2.6, chin:.5},
  frog: {rx:1.22, ry:.78, n:2.4},
  dog:  {rx:.95,  ry:1.04,n:2.6, jowl:.12},
  chick:{rx:.95,  ry:1.0, n:2.1, egg:.16},
  bear: {rx:1.06, ry:.94, n:2.3, egg:.06},
  bunny:{rx:.92,  ry:1.0, n:2.2, egg:.08},
  mouse:{rx:.9,   ry:.96, n:2.1, egg:.2},
  pig:  {rx:1.14, ry:.88, n:2.6},
  panda:{rx:1.06, ry:.94, n:2.5},
  fish: {rx:1.2,  ry:.8,  n:1.7},
  owl:  {rx:1.0,  ry:1.0, n:4.0},
  blob: {rx:1,    ry:1,   n:2},

const headCache = new Map();
function headPts(sp, r){
  const h = HEAD[sp] || HEAD.blob, k = sp + r.toFixed(2); if(headCache.has(k)) return headCache.get(k);
  const out = [], N = 48, e = 2/h.n;
  for(let i=0;i<N;i++){

    if(h.chin && y > 0) x *= 1 - h.chin*(y/h.ry)**1.6;          // dagu lancip (rubah)
    if(h.jowl && y > .2) x *= 1 + h.jowl;                       // pipi turun (anjing)

    for(const s of [-1,1]){
      const a1 = -Math.PI/2 + s*.22, a2 = -Math.PI/2 + s*.95, at = -Math.PI/2 + s*.55;

  } else if(sp === 'pig'){
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(s*r*.25, -r*.92); ctx.lineTo(s*r*.78, -r*1.1); ctx.lineTo(s*r*.72, -r*.55); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); inkStroke(lw); }

function drawFood(f, spr){
  const bob = spr ? 0 : Math.sin(T*3 + f.ph)*3;
  if(mode === 'eat'){
    ctx.beginPath(); ctx.arc(f.x, f.y, 15, 0, 7); ctx.fillStyle = f.col; ctx.fill(); inkStroke(4);

    ctx.lineTo(-10, 13); ctx.quadraticCurveTo(-19, 13, -17, 6); ctx.quadraticCurveTo(-5, -16, 0, -17); ctx.closePath();

  }

}

function pxDisc(x, y, r, fill, _u, cut, cutCol, ring){

  for(let yy=-R; yy<R; yy++){

    ctx.fillStyle = INK; ctx.fillRect(x - hw*u, y + yy*u, hw*2*u, u);

function hud(){
  // garis pembagi area (pensil)
  ctx.fillStyle = '#110a02';
  if(!solo()){ for(let y=snapA(70); y<H; y+=6*PXC) ctx.fillRect(snapA(W/2), y, PXC, 3*PXC);
  if(match.n > 2) for(let x=0; x<W; x+=6*PXC) ctx.fillRect(x, snapA(H/2), 3*PXC, PXC); }
  hudPops();

  const R = BR();
  for(const p of players){
    const ch = CHARS[p.i], b = btnPos(p.i), top = p.i >= 2 && !solo(), pad = pads[p.i];
    if(p.bot){                                // bot: cukup label di pojoknya
      const dir = b.x < W/2 ? 1 : -1;
      ctx.save(); ctx.translate(snapA(b.x - dir*R*.9), snapA(b.y)); if(top) ctx.rotate(Math.PI);
      tag(0, b.y < H/2 ? -R*.3 : R*.45, `BOT ${ch.n} ${'★'.repeat(match.wins[p.i]) || '·'} ${liveText(p)}`, ch.d, 13, dir > 0 ? 'left' : 'right');
      ctx.restore(); continue;
    }
    // joystick
    if(pad.id !== null){
      const jr = JR();
      pxDisc(pad.ox, pad.oy, jr, '#f2eee3', 0, undefined, undefined, true);
      let kx = pad.px - pad.ox, ky = pad.py - pad.oy; const kl = Math.hypot(kx,ky);
      if(kl > jr){ kx = kx/kl*jr; ky = ky/kl*jr; }
      pxDisc(pad.ox + kx, pad.oy + ky, jr*.45, ch.c);
    }
    // tombol dash
    ctx.save(); ctx.translate(snapA(b.x), snapA(b.y)); if(top) ctx.rotate(Math.PI);
    if(pad.press > 0) ctx.translate(0, 2*PXC);
    const ready = canDash(p) && state === 'play';
    pxDisc(PXC, 2*PXC, R, '#110a02');
    pxDisc(0, 0, R, ready ? ch.c : '#aca394', 0, p.dashCd > 0 ? p.dashCd/p.dashMax : undefined, '#6f5e57');
    ctx.fillStyle = '#f2eee3'; ctx.fillRect(-snapA(R*.55), -snapA(R*.6), 3*PXC, 2*PXC);
    drawPixText(!isTouch() ? (solo() ? 'SPASI' : ['SPASI','ENTER','O','NUM0'][p.i]) : mode === 'snow' ? '❄' : 'DASH', 0, PXC*.5, 1, INK, 'center');
    // label pemain
    const dir = solo() ? -1 : ((p.i === 0 || p.i === 3) ? 1 : -1) * (save.dashPos === 'in' ? -1 : 1);
    const live = liveText(p);
    tag(dir*(R+10), R*.45, `${ch.n} ${'★'.repeat(match.wins[p.i]) || '·'} ${live}`, ch.d, 13, dir > 0 ? 'left' : 'right');
    ctx.restore();
  }
  // judul ronde & waktu
  const tm = MODES[mode].time ? '  ⏱ ' + Math.max(0, Math.ceil(tLeft)) : '';
  tag(W/2, 44, `${MODES[mode].name}${tm}${mode === 'soccer' ? '   ' + X.goals[0] + ' : ' + X.goals[1] : ''}`, INK, 15, 'center', true);
  pxText(`${t('round')} ${Math.min(match.idx+1, match.order.length)}/${match.order.length}`, W/2, 68, 12, '#f2eee3');

  if(state === 'count'){
    const n = Math.ceil(tCount);
    const pop = 1 + (tCount % 1)*.35;
    ctx.save(); ctx.translate(W/2, H/2 - 10); ctx.scale(pop, pop); ctx.translate(-W/2, -(H/2 - 10));
    bigText(tCount > .2 ? String(n) : t('start'), H/2 - 10, 64, tCount > .2 ? '#ffc33a' : '#1db578');

      bigText(t('kbEsc'), H/2 + 116, 11, '#86aaa2');
    }
  }
  if(state === 'end') bigText(endText, H/2, 38, endCol);
}

// latar: pita warna + sinar berputar & lampu sorot dengan dithering (bukan transparansi)
function homeBg(L, step, bare){

  g.fillStyle = '#fcb67a'; g.fillRect(sx, st, sw2, 1);

  g.fillRect(sx, st + 9, sw2, 1);

  g.fillStyle = '#9e1e74'; g.fillRect(sx, st + 11, sw2, AH - st - 11);                 // kain depan panggung

  g.fillStyle = '#e6687d'; for(let x = sx; x < sx + sw2; x += 10){ g.fillRect(x, st + 11, 10, 1); g.fillRect(x + 1, st + 12, 8, 1); g.fillRect(x + 3, st + 13, 4, 1); }

// konfeti piksel: bentuk 2x1 -> 1x1 -> 1x2 -> 1x1 (frame), posisi selalu bulat
