  :root{--ink:#422a3c;--paper:#feffec}

function spawnPos(i, n){
  if(mode === 'sumo'){
    const a = n === 2 ? (i ? 0 : Math.PI) : (Math.PI*2/n)*i + Math.PI*.75;
    return {x: CX + Math.cos(a)*170, y: CY + Math.sin(a)*170};
  }
  if(mode === 'soccer'){
    const team = i % 2, mates = [0,1,2,3].filter(j => j < n && j % 2 === team);
    const y = mates.length > 1 ? (i < 2 ? CY + 130 : CY - 130) : CY;
    return {x: team ? WW-320 : 320, y};
  }
  if(n === 2) return i === 0 ? {x:220,y:CY} : {x:WW-220,y:CY};
  return [{x:200,y:480},{x:WW-200,y:480},{x:200,y:195},{x:WW-200,y:195}][i];
}
function startRound(){
  mode = match.order[match.idx];
  players = [];
  for(let i=0;i<match.n;i++){
    const sp = spawnPos(i, match.n);
    const fx = CX - sp.x, fy = CY - sp.y, fl = Math.hypot(fx,fy) || 1;
    players.push({i, x:sp.x, y:sp.y, vx:0, vy:0, m: mode === 'eat' ? 900 : (mode === 'paint' || mode === 'soccer') ? 1300 : 1600, hp:3, score:0, alive:true, fall:0, fallMax:.6,
      cx:0, cy:0, fx:fx/fl, fy:fy/fl, dashCd:0, dashMax:1, dashFx:0, seed:rnd(0,9), blink:rnd(1,3), scared:false, won:false, expr:'normal', bot: i >= match.hum, bt:rnd(.3,.8)});
  }
  food = []; parts = [];
  if(mode === 'eat') for(let i=0;i<100;i++) food.push(newFood());
  if(mode === 'food') for(let i=0;i<12;i++) food.push(newFood());
  initExtra();
  arenaR = 300; elapsed = 0; tLeft = MODES[mode].time; tCount = 3.2; tickPrev = 4; state = 'count';
}
function newFood(){
  return {x: rnd(30,WW-30), y: rnd(30,WH-30), col: ['#e43e3c','#fcc22c','#4c9ce8','#f08284','#8c5caa','#fcd6a2'][Math.floor(rnd(0,6))], v: (mode === 'food' && Math.random() < .14) ? 3 : 1, ph: rnd(0,6)};

// ---------- Kontrol ----------
// Tiap pemain punya "pad": joystick mengambang + tombol DASH tetap di pojoknya.
const pads = [0,1,2,3].map(() => ({id:null, ox:0, oy:0, px:0, py:0, t0:0, moved:false, press:0}));
const ptrs = new Map();               // pointerId -> {z, kind:'joy'|'btn'|'extra', x, y}
const JR = () => Math.max(42, Math.min(W,H)*.11) * SIZE[save.size];   // radius joystick
const BR = () => Math.max(32, Math.min(W,H)*.085) * SIZE[save.size];  // radius tombol dash
function btnPos(z){
  const m = BR() + 14;
  if(solo()) return [{x:W-m,y:H-m},{x:m,y:H-m},{x:m,y:m},{x:W-m,y:m}][z];   // tombol DASH di kanan bawah, bot di pojok lain
  if(save.dashPos === 'in') return [{x:W/2-m,y:H-m},{x:W/2+m,y:H-m},{x:W/2-m,y:m+58},{x:W/2+m,y:m+58}][z];
  return [{x:m,y:H-m},{x:W-m,y:H-m},{x:m,y:m},{x:W-m,y:m}][z];
}
const solo = () => match && match.hum === 1;
function zoneOf(x, y){
  if(solo()) return 0;                       // 1 pemain: seluruh layar untuk joystick
  const n = match ? match.n : 2;
  if(n === 2) return x < W/2 ? 0 : 1;
  const z = y < H/2 ? (x < W/2 ? 2 : 3) : (x < W/2 ? 0 : 1);
  return z < n ? z : -1;
}
const inputOn = () => match && (state === 'count' || state === 'play' || state === 'end');
function startJoy(pad, id, x, y){ pad.id = id; pad.ox = pad.px = x; pad.oy = pad.py = y; pad.t0 = performance.now(); pad.moved = false; }

let QR = null;   // area tombol Menu (px CSS); cadangan kalau sentuhan jatuh ke kanvas
const inQR = e => QR && match && e.clientX >= QR[0] && e.clientX <= QR[0] + QR[2] && e.clientY >= QR[1] && e.clientY <= QR[1] + QR[3];
cv.addEventListener('pointerdown', e => {
  if(inQR(e)){ e.preventDefault(); toMenu(); return; }
  if(!inputOn()) return;
  e.preventDefault();
  const z = zoneOf(e.clientX, e.clientY); if(z < 0 || !players[z]) return;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  const pad = pads[z], b = btnPos(z), o = {z, kind:'joy', x:e.clientX, y:e.clientY};
  if(Math.hypot(e.clientX-b.x, e.clientY-b.y) < BR()*1.3){ o.kind = 'btn'; pad.press = .15; dash(players[z]); }
  else if(pad.id === null) startJoy(pad, e.pointerId, e.clientX, e.clientY);
  else { o.kind = 'extra'; dash(players[z]); }     // jari kedua di area sendiri = dash
  ptrs.set(e.pointerId, o);
});
cv.addEventListener('pointermove', e => {
  const o = ptrs.get(e.pointerId); if(!o) return;
  o.x = e.clientX; o.y = e.clientY;
  if(o.kind !== 'joy') return;
  const pad = pads[o.z];
  pad.px = o.x; pad.py = o.y;
  const dx = pad.px-pad.ox, dy = pad.py-pad.oy, l = Math.hypot(dx,dy);
  if(l > 12) pad.moved = true;
  const lim = JR()*1.4;                      // pangkal joystick ikut jari kalau terlalu jauh
  if(l > lim){ pad.ox = pad.px - dx/l*lim; pad.oy = pad.py - dy/l*lim; }
});
function release(e){
  const o = ptrs.get(e.pointerId); if(!o) return;
  ptrs.delete(e.pointerId);
  if(o.kind !== 'joy') return;
  const pad = pads[o.z];
  if(e.type === 'pointerup' && !pad.moved && performance.now()-pad.t0 < 220 && players[o.z]) dash(players[o.z]);  // ketuk cepat = dash
  pad.id = null;
  for(const [id,q] of ptrs){                 // jari lain di area yang sama mengambil alih joystick
    if(q.z === o.z && q.kind === 'extra'){ q.kind = 'joy'; startJoy(pad, id, q.x, q.y); pad.moved = true; break; }
  }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);
addEventListener('contextmenu', e => e.preventDefault());

const keys = {};
// ===== KEYBOARD (main di laptop) =====
// P1 WASD + Spasi · P2 panah + Enter · P3 IJKL + O · P4 Numpad 8456 + Numpad 0. Main sendiri: WASD atau panah.
const KEYMAP = [
  {mv:['KeyA','KeyD','KeyW','KeyS'], dash:['Space','KeyQ','KeyE']},
  {mv:['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'], dash:['Enter','ShiftRight','NumpadEnter']},
  {mv:['KeyJ','KeyL','KeyI','KeyK'], dash:['KeyO','KeyU']},
  {mv:['Numpad4','Numpad6','Numpad8','Numpad5'], dash:['Numpad0','NumpadDecimal']},
];
const isTouch = () => save.ui === 'hp' ? true : save.ui === 'pc' ? false : matchMedia('(pointer:coarse)').matches;   // UI: Otomatis / Desktop / Android
addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  keys[e.code] = true;
  if(match && e.code === 'Escape'){ $('quit').click(); return; }
  if(state !== 'play' || e.repeat) return;
  KEYMAP.forEach((km, i) => {
    const owner = solo() ? 0 : i;                     // main sendiri: semua set tombol mengendalikan pemain 1
    if(km.dash.includes(e.code) && players[owner] && !players[owner].bot){ e.preventDefault(); dash(players[owner]); }
  });
  if(e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });

function readCtrl(p){
  const pad = pads[p.i];
  p.cx = p.cy = 0;
  if(pad.id !== null){
    const dx = pad.px-pad.ox, dy = pad.py-pad.oy, l = Math.hypot(dx,dy), dead = 8, R = JR();
    if(l > dead){ const m = Math.min(1, (l-dead)/(R-dead)); p.cx = dx/l*m; p.cy = dy/l*m; }
  } else {
    let x = 0, y = 0;
    KEYMAP.forEach((km, i) => { if(i !== p.i && !(solo() && p.i === 0)) return; const k = km.mv;
      x += (keys[k[1]]?1:0) - (keys[k[0]]?1:0); y += (keys[k[3]]?1:0) - (keys[k[2]]?1:0); });
    if(x || y){ const l = Math.hypot(x,y); p.cx = x/l; p.cy = y/l; }
  }
}
// ===== BOT =====
// Bot "berpikir" tiap 0.12-0.25 dtk (reaksi manusiawi), lalu menahan arah itu. Strategi berbeda per mini game.
function botCtrl(p, dt){
  p.bt -= dt; if(p.bt > 0) return;
  p.bt = rnd(.12, .25);
  const R = rad(p), others = players.filter(o => o.alive && o !== p);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const near = (list, f) => { let best = null, bd = 1e9; for(const o of list){ const d = f ? f(o) : dist(p, o); if(d < bd){ bd = d; best = o; } } return best; };
  let vx = 0, vy = 0, wantDash = false;
  const to = (x, y, w) => { const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy) || 1; w = w ?? 1; vx += dx/d*w; vy += dy/d*w; return d; };
  const away = (x, y, w) => { const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1; vx += dx/d*w; vy += dy/d*w; };
  const walls = () => { const m = 90; if(p.x < m) vx += (m - p.x)/m*1.5; if(p.x > WW - m) vx -= (p.x - WW + m)/m*1.5; if(p.y < m) vy += (m - p.y)/m*1.5; if(p.y > WH - m) vy -= (p.y - WH + m)/m*1.5; };
  const wander = () => { if(!p.wt || dist(p, p.wt) < 50 || Math.random() < .02) p.wt = {x:rnd(120, WW - 120), y:rnd(100, WH - 100)}; to(p.wt.x, p.wt.y, .8); };
  if(mode === 'eat'){
    const threat = others.filter(o => rad(o) > R*1.1 && dist(p, o) < R + rad(o) + 170);
    const prey = near(others.filter(o => R > rad(o)*1.12 && dist(p, o) < 300));
    if(threat.length){ for(const o of threat) away(o.x, o.y, 1.4); walls(); }
    else if(prey){ const d = to(prey.x + prey.vx*.2, prey.y + prey.vy*.2); wantDash = d < R + rad(prey) + 80 && Math.random() < .5; }
    else { const f = near(food); if(f) to(f.x, f.y); }
  } else if(mode === 'sumo'){
    const dc = Math.hypot(p.x - CX, p.y - CY), o = near(others);
    if(dc > arenaR - R*2.4) to(CX, CY, 1.6);
    if(o){ const d = to(o.x, o.y, .8); const od = Math.hypot(o.x - CX, o.y - CY); wantDash = d < 190 && od > dc*.8 && Math.random() < .45; }
  } else if(mode === 'food'){
    const f = near(food, f => dist(p, f)/(f.v > 1 ? 2.2 : 1)); if(f){ const d = to(f.x, f.y); wantDash = d > 220 && Math.random() < .08; }
  } else if(mode === 'bomb'){
    const h = players[X.h];
    if(h === p){ const o = near(others); if(o){ const d = to(o.x + o.vx*.25, o.y + o.vy*.25, 1.2); wantDash = d < 190 && X.imm <= 0 && Math.random() < .6; } }
    else if(h && h.alive){ const d = dist(p, h); if(d < 340){ away(h.x, h.y, 1.3); walls(); wantDash = d < 130 && Math.random() < .35; } else wander(); }
  } else if(mode === 'soccer'){
    if(X.pause > 0){ p.cx = p.cy = 0; return; }
    const B = X.ball, team = p.i % 2, gx = team === 0 ? WW + 40 : -40, ownX = team === 0 ? 60 : WW - 60;
    const mates = players.filter(o => o.alive && o.i % 2 === team), striker = near(mates, o => dist(o, B)) === p;
    if(striker){
      const ux = gx - B.x, uy = CY - B.y, ul = Math.hypot(ux, uy) || 1, bx = B.x - ux/ul*(R + B.r + 20), by = B.y - uy/ul*(R + B.r + 20);
      const behind = (team === 0 ? p.x < B.x - 10 : p.x > B.x + 10);
      if(!behind || Math.hypot(p.x - bx, p.y - by) > 45){ to(bx, by + (Math.abs(p.y - B.y) < R + B.r && !behind ? (p.y < B.y ? -60 : 60) : 0), 1); }
      else { const d = to(B.x, B.y, 1); wantDash = d < R + B.r + 60 && Math.random() < .5; }
    } else { to(ownX + (team === 0 ? 220 : -220), clamp(B.y, CY - 120, CY + 120), .9); }
  } else if(mode === 'crown'){
    p.agg = p.agg ?? rnd(.25, 1);                                   // kepribadian: berani rebut vs sabar menunggu

const canDash = p => p.alive && p.dashCd <= 0 && !(mode === 'eat' && p.m < 400);

function buzz(ms){ if(!save.vib) return; try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function burst(x, y, col, n, spd){

// ---------- Update ----------
const rad = p => Math.sqrt(p.m);

const ANIM = {

  move: [[110, -1, 1], [90, 0, 0], [110, 1, -1], [90, 0, 0]], // lompat kecil saat berjalan
  dash: [[60, 1, -1], [90, -1, 2], [80, -1, 1], [70, 1, -1]], // antisipasi -> regang -> mantul

}

function update(dt){

function collide(rest){
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    const a = players[i], b = players[j];
    if(!a.alive || !b.alive) continue;
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || .001, min = rad(a)+rad(b);

      const rel = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
      if(rel > 0){
        const imp = (1+rest)*rel/2;

        if(rel > 260){

function checkRoundEnd(){

    if(alive.length <= 1) winners = alive;

  } else if(mode === 'bomb' || mode === 'meteor'){ if(alive.length <= 1) winners = alive; }

    if(alive.length <= 1) winners = alive;

  } else if(mode === 'soccer'){
    const g = X.goals;
    if(g[0] >= 3 || g[1] >= 3 || tLeft <= 0) winners = g[0] === g[1] ? [] : players.filter(p => p.i % 2 === (g[0] > g[1] ? 0 : 1));

    if(tm < HOPT){ let t2 = tm; for(const f of HOP){ if(t2 < f[0]){ up = f[1]; ang = f[2]; break; } t2 -= f[0]; } c.hop = true; }
    else if(c.hop){ c.hop = false; playShot(c, 'bonk'); }
    animStep(c, dt);
    c.blink -= dt; if(c.blink < -.12) c.blink = rnd(2, 4);
    c.expr = up < -6 ? 'happy' : c.blink < 0 ? 'blink' : 'normal';
    const ax = L.cx + Math.round((c.i - 1.5)*spc);
    c.m = (R*PXC)**2; c.x = ax*PXC; c.y = (feet - R + up)*PXC; c.fx = (L.cx - ax)/(spc*3); c.fy = .3;
    const shw = Math.max(6, R - 4 + up/2); g.fillStyle = '#a04438'; g.fillRect(ax - shw, feet - 2, shw*2, 4);
    c.ang = ang*Math.PI*2/ROTN*(c.i % 2 ? -1 : 1);
  });
  homeConfetti(g, dt, ms);
  homeUI(L, ms);
}
// konfeti piksel: bentuk 3x2 -> 2x2 -> 2x3 -> 2x2 (frame), posisi selalu bulat
function homeConfetti(g, dt, ms){
  if(!HOME.conf.length) for(let i=0;i<60;i++) HOME.conf.push({x:Math.random(), y:Math.random(), v:rnd(20,44), w:rnd(0,6), c:CONF[i % 5], f:rnd(0,480)});
  for(const q of HOME.conf){ q.y += q.v*dt/AH; if(q.y > 1.03){ q.y = -.03; q.x = Math.random(); }
    const fr = Math.floor((ms + q.f)/120) & 3, x = Math.round(q.x*AW + Math.sin(ms/700 + q.w)*6), y = Math.round(q.y*AH);
    g.fillStyle = q.c; if(fr === 0) g.fillRect(x, y, 3, 2); else if(fr === 2) g.fillRect(x, y, 2, 3); else g.fillRect(x, y, 2, 2); }
}
function homeUI(L, ms){
  const u2 = artCanvas(HUDB); u2.setTransform(1,0,0,1,0,0); u2.filter = 'none'; u2.clearRect(0, 0, AW, AH);
  // logo
  const word = 'DRAW PARTY';
  let lw = 0; for(const ch of word) lw += logoW(ch); lw -= 2;
  let lx = L.cx - (lw >> 1); const ly = L.ly, wave = Math.floor(ms/90) % 18;
  [...word].forEach((ch, k) => { if(ch !== ' '){ const im = logoGlyph(ch, k); u2.drawImage(im, lx - 1, ly - 1 - (wave === k ? 4 : wave === k + 1 || wave === k - 1 ? 2 : 0)); } lx += logoW(ch); });
  // pita "234 MINIGAMES"
  const rt = '234  MINIGAMES', rw = hW(rt) + 24, rx = L.cx - (rw >> 1), ry = ly + 36, rh = FH + 12;
  u2.fillStyle = INK; u2.fillRect(rx - 14, ry + 4, rw + 28, rh - 2);
  u2.fillStyle = '#8c5caa'; u2.fillRect(rx - 13, ry + 5, 13, rh - 4); u2.fillRect(rx + rw, ry + 5, 13, rh - 4);
  u2.fillStyle = '#6c3e78'; u2.fillRect(rx - 2, ry + 5, 2, rh - 4); u2.fillRect(rx + rw, ry + 5, 2, rh - 4);
  u2.fillStyle = '#464c74'; for(let k=0;k<6;k++){ const yy = ry + 5 + (rh - 4)/2 - Math.abs(k - 3) - 1; u2.fillRect(rx - 14 + k, Math.round(yy), 1, Math.abs(k - 3)*2 + 2 > 0 ? 1 : 1); u2.fillRect(rx + rw + 13 - k, Math.round(yy), 1, 1); }
  u2.fillStyle = INK; u2.fillRect(rx, ry, rw, rh);
  u2.fillStyle = '#f05078'; u2.fillRect(rx + 1, ry + 1, rw - 2, rh - 2);
  u2.fillStyle = '#f08284'; u2.fillRect(rx + 1, ry + 1, rw - 2, 2);
  u2.fillStyle = '#8c5caa'; u2.fillRect(rx + 1, ry + rh - 4, rw - 2, 3);
  hText(u2, '234', rx + 12, ry + 5, '#fcc22c', '3d'); hText(u2, 'MINIGAMES', rx + 12 + hW('234  ') + FSP, ry + 5, '#feffec', '3d');
  // tombol
  const pulse = Math.floor(ms/110) % 9 === 0;
  for(const b of L.btns){
    const dn = HOME.press === b.id;
    if(b.id === 'bStars'){
      const txt = String(save.stars), w = 8 + 14 + 6 + hW(txt) + 10; b.w = w;
      const y = hBox(u2, b.x, b.y, w, b.h, b.th, dn); hText(u2, '★', b.x + 8, y + ((b.h - FH) >> 1) - 1, '#fcc22c'); hText(u2, txt, b.x + 8 + 14 + 6, y + ((b.h - FH) >> 1) - 1, '#422a3c'); continue;
    }
    const lift = b.big && pulse && !dn ? -2 : 0, IS = 22;
    const y = b.tab ? hTab(u2, b.x, b.y + lift, b.w, b.h - lift, b.th, dn) : hBox(u2, b.x, b.y + lift, b.w, b.h - lift, b.th, dn);
    const im = b.ic && hImg(b.ic), lab = b.lab && !b.iconOnly ? t(b.lab).toUpperCase() : '';
    const SL = b.tab ? Math.floor((b.h - 1)/4) : 0, cxo = b.x + (SL >> 1);
    if(b.dot && save[b.dot] !== today()){ const f2 = Math.floor(ms/400) & 1; u2.fillStyle = INK; u2.fillRect(b.x + b.w - 10, y - 5, 10, 10); u2.fillStyle = f2 ? '#fcc22c' : '#f89618'; u2.fillRect(b.x + b.w - 9, y - 4, 8, 8); u2.fillStyle = '#feffec'; u2.fillRect(b.x + b.w - 8, y - 3, 2, 2); }
    if(!lab){ if(im) u2.drawImage(im, cxo + ((b.w - SL - IS) >> 1), y + ((b.h - IS) >> 1)); continue; }
    if(im) u2.drawImage(im, cxo + 8, y + ((b.h - IS) >> 1));
    const tx = cxo + 8 + IS + 6, tw = hW(lab);
    hText(u2, lab, tx + ((b.w - SL - (tx - b.x) - 8 - tw) >> 1), y + ((b.h - FH) >> 1) - 1, b.big ? '#422a3c' : '#feffec', b.big ? '2d' : '3d');
    if(b.big && pulse){ u2.fillStyle = '#feffec'; u2.fillRect(b.x + b.w - 10, y + 4, 2, 6); u2.fillRect(b.x + b.w - 12, y + 6, 6, 2); }
  }
  // posisi area sentuh DOM
  const pk = HOME.key + W + 'x' + H + L.btns.map(b => b.w).join(',');
  if(HOME.posKey !== pk){ HOME.posKey = pk; for(const b of L.btns){ const e = $(b.id); if(!e) continue;
    const pd = 3*U;   // area sentuh tak terlihat lebih lebar dari gambar tombol (tidak saling tumpuk: jarak antar tombol >= 6U)
    Object.assign(e.style, {left:(b.x - pd)*PXC + 'px', top:(b.y - pd)*PXC + 'px', width:(b.w + pd*2)*PXC + 'px', height:(b.h + 4 + pd*2)*PXC + 'px'}); } }
  // susun: latar -> karakter -> UI, semua dikali K
  ctx = sctx; PXW = 1;
  blit([[HB, 0, 0]]);
  [...menuChars].sort((a,b) => a.i - b.i).forEach(c => charSpr(Object.assign({}, c, {vx:0}), 10 + c.i, c.ang));
  drawSprites();
  blit([[HUDB, 0, 0]], true);
}
document.querySelectorAll('#home .hz').forEach(e => {
  e.addEventListener('pointerdown', () => { HOME.press = e.id; });
  for(const ev of ['pointerup','pointercancel','pointerleave']) e.addEventListener(ev, () => { if(HOME.press === e.id) HOME.press = null; });
});
function renderMenu(dt){ T += dt; homeFrame(dt); }
refreshHome();

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  setSong(state === 'menu' || !match ? 'menu' : 'game'); musicTick();
  const scrOpen = !$('chars').classList.contains('hidden'), drOpen = !$('draw').classList.contains('hidden');
  const gmOpen = !$('games').classList.contains('hidden');
  if(drOpen){ T += dt; homeFrame(dt, true); renderDrawPreview(); }
  else if(scrOpen){ T += dt; homeFrame(dt, true); renderAvatar(dt); }
  else if(gmOpen && (state === 'menu' || !match)){ T += dt; homeFrame(dt, true); }
  else if(state === 'menu' || !match) renderMenu(dt);
  else { update(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
