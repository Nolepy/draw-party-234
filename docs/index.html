<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw Party 234 MiniGames</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f1424;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,28,.88);text-align:center;padding:12px;box-sizing:border-box}
  .hidden{display:none!important}
  h1{margin:0;font-size:30px}
  h1 span{color:#5ee0a0}
  h3{margin:4px 0 0;font-size:13px;opacity:.7;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{font-size:15px;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid #2d3860;background:#1a2342;color:#fff;cursor:pointer}
  .chip.sel{border-color:#5ee0a0;background:#1f3d38}
  .chip small{display:block;font-weight:500;font-size:11px;opacity:.7;margin-top:2px}
  .go{font-size:20px;font-weight:800;padding:12px 50px;border:0;border-radius:14px;background:#5ee0a0;color:#0b2a1b;cursor:pointer;margin-top:4px}
  .hint{font-size:12px;opacity:.6;max-width:520px;line-height:1.4}
  #quit{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:4px 14px;font-size:14px;opacity:.5}
  #rot{display:none;position:fixed;inset:0;z-index:10;background:#0f1424;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
  @media (orientation:portrait){#rot{display:flex}}
  #champ{font-size:28px;font-weight:800}
  #tab{font-size:18px;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="quit" class="hidden">✕ Menu</button>

<div class="overlay" id="menu">
  <h1>Draw Party <span>234</span> MiniGames</h1>
  <h3>Mode</h3>
  <div class="row" id="modes">
    <button class="chip" data-m="eat">Sel Rebutan<small>makan &amp; membesar</small></button>
    <button class="chip" data-m="sumo">Sumo Blob<small>dorong keluar</small></button>
    <button class="chip" data-m="food">Rebutan Makanan<small>kumpulkan paling banyak</small></button>
    <button class="chip sel" data-m="combo">Gabungan<small>3 mode bergantian</small></button>
  </div>
  <h3>Jumlah pemain</h3>
  <div class="row" id="np">
    <button class="chip sel" data-n="2">2</button>
    <button class="chip" data-n="3">3</button>
    <button class="chip" data-n="4">4</button>
  </div>
  <button class="go" id="start">MULAI</button>
  <div class="hint">Tiap pemain pakai satu jempol di areanya: <b>geser</b> untuk bergerak, <b>ketuk cepat</b> untuk dash. Pemain 2: kiri/kanan. Pemain 3–4: sudut layar (P1 kiri-bawah, P2 kanan-bawah, P3 kiri-atas, P4 kanan-atas).</div>
</div>

<div class="overlay hidden" id="end">
  <div id="champ"></div>
  <div id="tab"></div>
  <div class="row">
    <button class="go" id="again">MAIN LAGI</button>
    <button class="go" id="tomenu" style="background:#8aa0ff">MENU</button>
  </div>
</div>

<div id="rot">Putar HP ke mode landscape 📱↔️</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W, H, DPR, S, OX, OY;
const WW = 1600, WH = 900, CX = 800, CY = 450;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  S = Math.min(W/WW, H/WH); OX = (W-WW*S)/2; OY = (H-WH*S)/2;
}
addEventListener('resize', resize); resize();

const PCOL = [{h:0,n:'Merah'},{h:210,n:'Biru'},{h:130,n:'Hijau'},{h:45,n:'Kuning'}];
const MODES = {
  eat: {name:'Sel Rebutan', time:75, hint:'Makan titik &amp; sel yang lebih kecil!'},
  sumo:{name:'Sumo Blob', time:90, hint:'Dorong lawan keluar arena!'},
  food:{name:'Rebutan Makanan', time:60, hint:'Kumpulkan makanan terbanyak! Emas = 3 poin.'}
};
const rnd = (a,b) => a + Math.random()*(b-a);

let sel = {mode:'combo', n:2};
let match = null, players = [], food = [], mode = 'eat', state = 'menu', tCount = 0, tLeft = 0, tEnd = 0, endText = '', arenaR = 440, elapsed = 0;

// ---------- Menu ----------
document.querySelectorAll('#modes .chip').forEach(b => b.onclick = () => {
  document.querySelectorAll('#modes .chip').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel.mode = b.dataset.m;
});
document.querySelectorAll('#np .chip').forEach(b => b.onclick = () => {
  document.querySelectorAll('#np .chip').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel.n = +b.dataset.n;
});
$('start').onclick = startMatch;
$('again').onclick = startMatch;
$('tomenu').onclick = toMenu;
$('quit').onclick = toMenu;
function toMenu(){ state = 'menu'; match = null; $('menu').classList.remove('hidden'); $('end').classList.add('hidden'); $('quit').classList.add('hidden'); }

function startMatch(){
  const order = sel.mode === 'combo' ? ['eat','sumo','food'] : [sel.mode,sel.mode,sel.mode];
  match = {order, idx:0, wins:new Array(sel.n).fill(0), n:sel.n};
  $('menu').classList.add('hidden'); $('end').classList.add('hidden'); $('quit').classList.remove('hidden');
  startRound();
}

// ---------- Round setup ----------
function spawnPos(i, n){
  if(mode === 'sumo'){
    const a = (Math.PI*2/n)*i + Math.PI/4;
    return {x: CX + Math.cos(a)*240, y: CY + Math.sin(a)*240};
  }
  if(n === 2) return i === 0 ? {x:300,y:CY} : {x:1300,y:CY};
  return [{x:260,y:650},{x:1340,y:650},{x:260,y:250},{x:1340,y:250}][i];
}
function startRound(){
  mode = match.order[match.idx];
  const n = match.n;
  const oldTouch = players.map(p => p.t);
  players = [];
  for(let i=0;i<n;i++){
    const sp = spawnPos(i, n);
    const fx = CX - sp.x, fy = CY - sp.y, fl = Math.hypot(fx,fy) || 1;
    players.push({i, x:sp.x, y:sp.y, vx:0, vy:0, m: mode === 'eat' ? 500 : 784, score:0, alive:true, fall:0, cx:0, cy:0,
      fx:fx/fl, fy:fy/fl, dashCd:0, dashFx:0, h:PCOL[i].h,
      t: oldTouch[i] || {id:null, ox:0, oy:0, px:0, py:0, t0:0, moved:false}});
  }
  food = [];
  if(mode === 'eat') for(let i=0;i<140;i++) food.push(newFood());
  if(mode === 'food') for(let i=0;i<14;i++) food.push(newFood(true));
  arenaR = 440; elapsed = 0; tLeft = MODES[mode].time; tCount = 3.2; state = 'count';
}
function newFood(special){
  const f = {x: rnd(40,WW-40), y: rnd(40,WH-40), h: rnd(0,360), v:1};
  if(mode === 'food' && Math.random() < .12) f.v = 3;
  return f;
}

// ---------- Input ----------
function zoneOf(x, y){
  const n = match ? match.n : 2;
  if(n === 2) return x < W/2 ? 0 : 1;
  const left = x < W/2, top = y < H/2;
  const z = top ? (left ? 2 : 3) : (left ? 0 : 1);
  return z < n ? z : -1;
}
const ptrOwner = new Map();
cv.addEventListener('pointerdown', e => {
  if(state === 'menu' || !match) return;
  const z = zoneOf(e.clientX, e.clientY); if(z < 0) return;
  const p = players[z], t = p.t;
  cv.setPointerCapture(e.pointerId);
  if(t.id !== null){ dash(p); return; }       // jari kedua = dash
  ptrOwner.set(e.pointerId, z);
  t.id = e.pointerId; t.ox = t.px = e.clientX; t.oy = t.py = e.clientY; t.t0 = performance.now(); t.moved = false;
});
cv.addEventListener('pointermove', e => {
  const z = ptrOwner.get(e.pointerId); if(z === undefined || !players[z]) return;
  const t = players[z].t;
  t.px = e.clientX; t.py = e.clientY;
  let x = t.px - t.ox, y = t.py - t.oy, l = Math.hypot(x,y);
  if(l > 14) t.moved = true;
  if(l > 60){ t.ox = t.px - x/l*60; t.oy = t.py - y/l*60; }
});
function release(e){
  const z = ptrOwner.get(e.pointerId); if(z === undefined) return;
  ptrOwner.delete(e.pointerId);
  const p = players[z]; if(!p) return;
  const t = p.t;
  if(e.type === 'pointerup' && !t.moved && performance.now()-t.t0 < 250) dash(p);   // ketuk cepat = dash
  t.id = null; p.cx = p.cy = 0;
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
addEventListener('contextmenu', e => e.preventDefault());

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if(state !== 'play') return;
  if(e.code === 'Space' && players[0]) dash(players[0]);
  if(e.code === 'Enter' && players[1]) dash(players[1]);
});
addEventListener('keyup', e => keys[e.code] = false);

function dash(p){
  if(state !== 'play' || !p.alive || p.dashCd > 0) return;
  if(mode === 'eat'){ if(p.m < 220) return; p.m -= p.m*0.06; }
  const imp = mode === 'eat' ? 700 : mode === 'sumo' ? 700 : 800;
  p.vx += p.fx*imp; p.vy += p.fy*imp;
  p.dashCd = mode === 'eat' ? .8 : 1; p.dashFx = .25;
}

// ---------- Update ----------
const rad = p => Math.sqrt(p.m);
function params(p){
  if(mode === 'eat'){ const ms = 330*Math.pow(rad(p)/22, -0.3); return {ms, k:4}; }
  if(mode === 'sumo') return {ms:310, k:2.2};
  return {ms:340, k:3.5};
}
function readCtrl(p){
  const t = p.t;
  if(t.id !== null){
    const x = t.px-t.ox, y = t.py-t.oy, l = Math.hypot(x,y);
    if(l > 6){ const m = Math.min(1, l/45); p.cx = x/l*m; p.cy = y/l*m; } else { p.cx = p.cy = 0; }
  } else if(p.i < 2) {
    const k = p.i === 0 ? ['KeyA','KeyD','KeyW','KeyS'] : ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];
    let x = (keys[k[1]]?1:0) - (keys[k[0]]?1:0), y = (keys[k[3]]?1:0) - (keys[k[2]]?1:0);
    const l = Math.hypot(x,y) || 1; p.cx = x/l; p.cy = y/l;
    if(!x && !y){ p.cx = p.cy = 0; }
  }
}

function update(dt){
  if(state === 'count'){ tCount -= dt; if(tCount <= 0) state = 'play'; }
  for(const p of players){ if(p.fall > 0) p.fall = Math.max(0, p.fall - dt); }
  if(state === 'end'){
    tEnd -= dt;
    if(tEnd <= 0){
      match.idx++;
      if(match.idx >= match.order.length) finishMatch(); else startRound();
    }
    return;
  }
  if(state !== 'play') return;
  elapsed += dt; tLeft -= dt;

  for(const p of players){
    if(!p.alive) continue;
    readCtrl(p);
    if(Math.hypot(p.cx,p.cy) > .2){ const l = Math.hypot(p.cx,p.cy); p.fx = p.cx/l; p.fy = p.cy/l; }
    const {ms,k} = params(p);
    p.vx += p.cx*ms*k*dt; p.vy += p.cy*ms*k*dt;
    const f = Math.exp(-k*dt); p.vx *= f; p.vy *= f;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.dashCd = Math.max(0, p.dashCd-dt); p.dashFx = Math.max(0, p.dashFx-dt);
  }

  if(mode === 'sumo'){
    arenaR = Math.max(30, 440 - elapsed*5.5);
    collide();
    for(const p of players){
      if(!p.alive) continue;
      if(Math.hypot(p.x-CX, p.y-CY) > arenaR + rad(p)*0.35){ p.alive = false; p.fall = .45; buzz(); }
    }
  } else {
    for(const p of players){
      if(!p.alive) continue;
      const r = rad(p);
      if(p.x < r){ p.x = r; p.vx = Math.abs(p.vx)*.3; } if(p.x > WW-r){ p.x = WW-r; p.vx = -Math.abs(p.vx)*.3; }
      if(p.y < r){ p.y = r; p.vy = Math.abs(p.vy)*.3; } if(p.y > WH-r){ p.y = WH-r; p.vy = -Math.abs(p.vy)*.3; }
    }
    if(mode === 'food') collide();
    // makanan
    for(const p of players){
      if(!p.alive) continue;
      const r = rad(p);
      for(let i=0;i<food.length;i++){
        const f = food[i], fr = mode === 'food' ? (f.v>1?16:11) : 7;
        if(Math.hypot(f.x-p.x, f.y-p.y) < r + fr*0.6){
          if(mode === 'eat') p.m += 14; else p.score += f.v;
          food[i] = newFood();
        }
      }
      if(mode === 'eat' && p.m > 1400) p.m -= p.m*0.004*dt;
    }
    if(mode === 'eat'){
      for(const a of players) for(const b of players){
        if(a === b || !a.alive || !b.alive) continue;
        const ra = rad(a), rb = rad(b);
        if(ra > rb*1.12 && Math.hypot(a.x-b.x, a.y-b.y) < ra - rb*0.3){ a.m += b.m*0.85; b.alive = false; b.fall = .3; buzz(); }
      }
    }
  }
  checkRoundEnd();
}
function buzz(){ try{ navigator.vibrate && navigator.vibrate(40); }catch(e){} }

function collide(){
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    const a = players[i], b = players[j];
    if(!a.alive || !b.alive) continue;
    let dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || .001;
    const min = rad(a)+rad(b);
    if(d < min){
      const nx = dx/d, ny = dy/d, ov = (min-d)/2;
      a.x -= nx*ov; a.y -= ny*ov; b.x += nx*ov; b.y += ny*ov;
      const rel = (a.vx-b.vx)*nx + (a.vy-b.vy)*ny;
      if(rel > 0){ const imp = (1+.95)*rel/2; a.vx -= imp*nx; a.vy -= imp*ny; b.vx += imp*nx; b.vy += imp*ny; }
    }
  }
}

function checkRoundEnd(){
  const alive = players.filter(p => p.alive);
  let winners = null;
  if(mode === 'sumo'){
    if(alive.length <= 1) winners = alive;
  } else if(mode === 'eat'){
    if(alive.length <= 1) winners = alive;
    else if(tLeft <= 0){ const mx = Math.max(...alive.map(p => p.m)); winners = alive.filter(p => p.m === mx); }
  } else {
    if(tLeft <= 0){ const mx = Math.max(...players.map(p => p.score)); winners = mx > 0 ? players.filter(p => p.score === mx) : []; }
  }
  if(!winners) return;
  for(const w of winners) match.wins[w.i]++;
  endText = winners.length === 0 ? 'Seri!' : winners.length === 1 ? PCOL[winners[0].i].n + ' menang ronde ini!' : 'Seri: ' + winners.map(w => PCOL[w.i].n).join(' & ');
  endHue = winners.length === 1 ? PCOL[winners[0].i].h : 0;
  state = 'end'; tEnd = 2.8;
}
let endHue = 0;

function finishMatch(){
  state = 'over';
  const mx = Math.max(...match.wins);
  const champs = match.wins.map((w,i) => w === mx ? i : -1).filter(i => i >= 0);
  $('champ').textContent = mx === 0 ? 'Semua seri!' : champs.length === 1 ? '🏆 ' + PCOL[champs[0]].n + ' juara!' : '🤝 Seri: ' + champs.map(i => PCOL[i].n).join(' & ');
  $('tab').innerHTML = match.wins.map((w,i) => `<span style="color:hsl(${PCOL[i].h},75%,65%)">${PCOL[i].n}</span>: ${w} ronde`).join('<br>');
  $('end').classList.remove('hidden'); $('quit').classList.add('hidden');
}

// ---------- Render ----------
function eyes(p, r){
  const px = -p.fy, py = p.fx;
  for(const s of [-1,1]){
    const ex = p.x + p.fx*r*.35 + px*s*r*.3, ey = p.y + p.fy*r*.35 + py*s*r*.3;
    ctx.beginPath(); ctx.arc(ex, ey, r*.22, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex + p.fx*r*.08, ey + p.fy*r*.08, r*.11, 0, 7); ctx.fillStyle = '#111'; ctx.fill();
  }
}
function drawPlayer(p){
  let r = rad(p);
  if(!p.alive){ if(p.fall <= 0) return; r *= p.fall / .45; if(r < 1) return; }
  if(p.dashFx > 0){ ctx.beginPath(); ctx.arc(p.x - p.vx*.03, p.y - p.vy*.03, r*1.25, 0, 7); ctx.fillStyle = `hsla(${p.h},80%,70%,.25)`; ctx.fill(); }
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
  ctx.fillStyle = `hsl(${p.h},72%,58%)`; ctx.fill();
  ctx.lineWidth = Math.max(3, r*.1); ctx.strokeStyle = `hsl(${p.h},72%,38%)`; ctx.stroke();
  eyes(p, r);
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#0f1424'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(OX,OY); ctx.scale(S,S);

  // arena
  if(mode === 'sumo'){
    ctx.beginPath(); ctx.arc(CX,CY,arenaR,0,7); ctx.fillStyle = '#1a2342'; ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = '#ff5d73'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 2;
    for(let r=60;r<arenaR;r+=80){ ctx.beginPath(); ctx.arc(CX,CY,r,0,7); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#161d33'; ctx.fillRect(0,0,WW,WH);
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 2; ctx.beginPath();
    for(let x=0;x<=WW;x+=100){ ctx.moveTo(x,0); ctx.lineTo(x,WH); }
    for(let y=0;y<=WH;y+=100){ ctx.moveTo(0,y); ctx.lineTo(WW,y); }
    ctx.stroke();
    ctx.strokeStyle = '#ff5d73'; ctx.lineWidth = 8; ctx.strokeRect(0,0,WW,WH);
  }
  // makanan
  for(const f of food){
    const gold = f.v > 1, r = mode === 'food' ? (gold?16:11) : 7;
    ctx.beginPath(); ctx.arc(f.x,f.y,r,0,7);
    ctx.fillStyle = gold ? '#ffd54a' : `hsl(${f.h},80%,62%)`; ctx.fill();
    if(gold){ ctx.lineWidth = 3; ctx.strokeStyle = '#fff3b0'; ctx.stroke(); }
  }
  [...players].sort((a,b) => a.m - b.m).forEach(drawPlayer);
  ctx.restore();

  // garis zona
  if(players.length){
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2; ctx.setLineDash([8,8]);
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H);
    if(match.n > 2){ ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); }
    ctx.stroke(); ctx.setLineDash([]);
  }
  // joystick
  for(const p of players){
    const t = p.t; if(t.id === null) continue;
    ctx.globalAlpha = .3; ctx.fillStyle = `hsl(${p.h},80%,70%)`;
    ctx.beginPath(); ctx.arc(t.ox,t.oy,48,0,7); ctx.fill();
    ctx.globalAlpha = .65; ctx.beginPath(); ctx.arc(t.px,t.py,20,0,7); ctx.fill(); ctx.globalAlpha = 1;
  }
  hud();
}

function hud(){
  if(!match) return;
  const n = match.n;
  const pos = [{x:12,y:H-12,a:'left',b:'bottom'},{x:W-12,y:H-12,a:'right',b:'bottom'},{x:12,y:12,a:'left',b:'top'},{x:W-12,y:12,a:'right',b:'top'}];
  ctx.font = '700 15px system-ui,sans-serif';
  for(const p of players){
    const q = pos[p.i];
    ctx.textAlign = q.a; ctx.textBaseline = q.b;
    ctx.fillStyle = `hsl(${p.h},80%,70%)`;
    const live = mode === 'eat' ? Math.floor(p.m) + ' massa' : mode === 'food' ? p.score + ' poin' : (p.alive ? 'hidup' : 'jatuh');
    const stars = '★'.repeat(match.wins[p.i]) || '–';
    ctx.fillText(`${PCOL[p.i].n}  ${stars}  ·  ${live}`, q.x, q.y);
  }
  // timer & info
  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#fff';
  ctx.font = '800 22px system-ui,sans-serif';
  const showT = mode === 'sumo' ? '' : Math.max(0, Math.ceil(tLeft)) + 's';
  ctx.fillText(MODES[mode].name + (showT ? '  ' + showT : ''), W/2, 34);
  ctx.font = '500 13px system-ui,sans-serif'; ctx.globalAlpha = .6;
  ctx.fillText(`Ronde ${Math.min(match.idx+1, match.order.length)}/${match.order.length}`, W/2, 62); ctx.globalAlpha = 1;

  if(state === 'count'){
    ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0,H/2-70,W,140);
    ctx.fillStyle = '#fff'; ctx.font = '800 54px system-ui,sans-serif';
    ctx.fillText(tCount > 0.2 ? Math.ceil(tCount) : 'MULAI!', W/2, H/2-8);
    ctx.font = '500 15px system-ui,sans-serif'; ctx.globalAlpha = .8;
    ctx.fillText(MODES[mode].hint.replace(/&amp;/g,'&'), W/2, H/2+34); ctx.globalAlpha = 1;
  }
  if(state === 'end'){
    ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0,H/2-50,W,100);
    ctx.fillStyle = `hsl(${endHue},80%,72%)`; ctx.font = '800 34px system-ui,sans-serif';
    ctx.fillText(endText, W/2, H/2);
  }
}

// ---------- Loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(state === 'menu'){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle = '#0f1424'; ctx.fillRect(0,0,W,H); }
  else if(match){ update(dt); if(state !== 'over' || players.length) render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
